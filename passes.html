<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>ADD EXEMPTION PASS</title>
    
    <style>
        * { box-sizing: border-box; }
        body { 
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; 
            margin: 0; 
            padding: 16px; 
            background: #121212; 
            color: #fff; 
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            -webkit-user-select: none;
        }
        .header {
            text-align: center;
            margin-top: 10px;
            margin-bottom: 24px;
        }
        .header h1 {
            margin: 0;
            font-size: 34px;
            font-weight: 900;
            color: #00e676;
            letter-spacing: 2px;
        }
        .card {
            background: #1e1e1e;
            border-radius: 18px;
            padding: 24px;
            width: 100%;
            max-width: 440px;
            border: 1px solid #2a2a2a;
            box-shadow: 0 6px 20px rgba(0,0,0,0.6);
        }
        label {
            font-size: 14px;
            text-transform: uppercase;
            color: #aaa;
            display: block;
            margin-top: 18px;
            font-weight: 800;
            letter-spacing: 1px;
        }
        input, select {
            width: 100%;
            height: 58px;
            padding: 0 16px;
            border-radius: 12px;
            border: 1px solid #333;
            background: #2a2a2a;
            color: #fff;
            font-size: 20px;
            font-weight: 700;
            margin-top: 8px;
            outline: none;
            box-sizing: border-box;
            appearance: none;
            -webkit-appearance: none;
        }
        input[type="date"] {
            color-scheme: dark;
            font-family: inherit;
        }
        input[type="text"] {
            text-transform: uppercase;
            letter-spacing: 2px;
            color: #00e676;
            font-size: 22px;
        }
        .submit-btn {
            background: #00e676;
            color: #000;
            font-weight: 900;
            border: none;
            border-radius: 14px;
            height: 64px;
            font-size: 24px;
            width: 100%;
            margin-top: 32px;
            cursor: pointer;
            box-shadow: 0 6px 20px rgba(0, 230, 118, 0.4);
            letter-spacing: 1px;
        }
        .submit-btn:active { transform: scale(0.97); }
        #status {
            text-align: center;
            font-weight: 800;
            font-size: 18px;
            margin-top: 20px;
            min-height: 28px;
        }
    </style>
</head>
<body>

<div class="header">
    <h1>ADD EXEMPTION PASS</h1>
</div>

<div class="card">
    <label>Property Name</label>
    <select id="propertyName">
        <option value="" disabled selected>Select Property</option>
    </select>

    <label>Vehicle Registration</label>
    <input type="text" id="rego" placeholder="E.G. XXX123" maxlength="10">

    <label>Start Date</label>
    <input type="date" id="startDate">

    <label>Duration (Days)</label>
    <input type="number" id="duration" value="1" min="1" max="365">

    <button class="submit-btn" id="saveBtn">LOG PASS</button>
    <div id="status"></div>
</div>

<iframe name="hiddenTarget" id="hiddenTarget" style="display:none;"></iframe>
<form id="bypassForm" action="https://script.google.com/macros/s/AKfycbzoWD84FAwprSdWAZlm4YeyjU9ps3kTW_XXN_QMkTJxvm-LMrnFIZ2RzDLDShbV5ATK8g/exec" method="POST" target="hiddenTarget" style="display:none;">
    <input type="hidden" name="payload" id="formPayload">
</form>

<script>
    const GOOGLE_SCRIPT_URL = "https://script.google.com/macros/s/AKfycbzoWD84FAwprSdWAZlm4YeyjU9ps3kTW_XXN_QMkTJxvm-LMrnFIZ2RzDLDShbV5ATK8g/exec";
    const propertySelect = document.getElementById('propertyName');
    const regoInput = document.getElementById('rego');
    const startDateInput = document.getElementById('startDate');
    const durationInput = document.getElementById('duration');
    const saveBtn = document.getElementById('saveBtn');
    const statusDiv = document.getElementById('status');
    const bypassForm = document.getElementById('bypassForm');
    const formPayload = document.getElementById('formPayload');

    // Auto-set today's date
    const today = new Date().toISOString().split('T')[0];
    startDateInput.value = today;

    // Fetch properties and keep "Select Property" as default option
    window.addEventListener('load', async () => {
        try {
            const res = await fetch(`${GOOGLE_SCRIPT_URL}?action=get_properties`);
            const props = await res.json();
            if (props && props.length > 0) {
                propertySelect.innerHTML = '<option value="" disabled selected>Select Property</option>';
                props.forEach(p => {
                    const opt = document.createElement('option');
                    opt.value = p.name;
                    opt.innerText = p.name.toUpperCase();
                    propertySelect.appendChild(opt);
                });
            }
        } catch(e) {
            propertySelect.innerHTML = '<option value="" disabled selected>Select Property</option>';
        }
    });

    saveBtn.addEventListener('click', () => {
        const propValue = propertySelect.value;
        const rego = regoInput.value.trim().toUpperCase();

        if (!propValue) {
            statusDiv.style.color = "#ff5252";
            statusDiv.innerText = "PLEASE SELECT A PROPERTY";
            return;
        }

        if (!rego) {
            statusDiv.style.color = "#ff5252";
            statusDiv.innerText = "PLEASE ENTER REGISTRATION";
            return;
        }

        statusDiv.style.color = "#00e676";
        statusDiv.innerText = "SAVING EXEMPTION...";

        const payloadObj = {
            "action": "add_pass",
            "propertyName": propValue,
            "rego": rego,
            "startDate": startDateInput.value,
            "duration": durationInput.value
        };

        formPayload.value = JSON.stringify(payloadObj);
        bypassForm.submit();

        setTimeout(() => {
            statusDiv.innerText = "✔ EXEMPTION PASS LOGGED!";
            regoInput.value = "";
            propertySelect.value = "";
            setTimeout(() => { statusDiv.innerText = ""; }, 2500);
        }, 1000);
    });
</script>

</body>
</html>
