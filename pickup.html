<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>TOW VEHICLE</title>
    
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="TOW">
    
    <link rel="apple-touch-icon" href="icon-tow.png?v=1">
    <link rel="icon" type="image/png" href="icon-tow.png?v=1">
    <link rel="manifest" href="manifest-pickup.json?v=1">

    <style>
        * { box-sizing: border-box; }
        body { 
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; 
            margin: 0; 
            padding: 12px; 
            background: #121212; 
            color: #fff; 
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            -webkit-user-select: none;
        }
        .header {
            text-align: center;
            margin-top: 4px;
            margin-bottom: 12px;
        }
        .header h1 {
            margin: 0;
            font-size: 34px;
            font-weight: 900;
            color: #ff1744;
            letter-spacing: 2px;
        }
        .card {
            background: #1e1e1e;
            border-radius: 18px;
            padding: 18px;
            width: 100%;
            max-width: 440px;
            border: 1px solid #2a2a2a;
            box-shadow: 0 6px 20px rgba(0,0,0,0.6);
            text-align: center;
        }
        .rego-banner {
            background: #2a2a2a;
            border-radius: 12px;
            padding: 8px;
            margin-bottom: 12px;
            font-size: 30px;
            font-weight: 900;
            color: #00e676;
            letter-spacing: 2px;
            border: 1px solid #333;
        }
        label {
            font-size: 12px;
            text-transform: uppercase;
            color: #aaa;
            display: block;
            margin-top: 10px;
            font-weight: 800;
            letter-spacing: 1px;
            text-align: center;
        }
        input, select {
            width: 100%;
            height: 52px;
            padding: 0 14px;
            border-radius: 12px;
            border: 1px solid #333;
            background: #2a2a2a;
            color: #fff;
            font-size: 18px;
            font-weight: 700;
            margin-top: 4px;
            outline: none;
            box-sizing: border-box;
            text-align: center;
            text-align-last: center;
            appearance: none;
            -webkit-appearance: none;
        }
        input[type="text"] { text-transform: uppercase; color: #00e676; }
        .custom-input { display: none; margin-top: 6px; border-color: #00e676; }
        
        /* Camera Section */
        .camera-box {
            position: relative;
            width: 100%;
            height: 160px;
            background: #000;
            border-radius: 14px;
            margin-top: 14px;
            overflow: hidden;
            border: 2px solid #2979ff;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        video { width: 100%; height: 100%; object-fit: cover; }
        .photo-controls {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-top: 10px;
            padding: 0 10px;
        }
        .shutter-btn {
            background: #2979ff;
            border: 4px solid #fff;
            width: 68px;
            height: 68px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 4px 16px rgba(41, 121, 255, 0.6);
            cursor: pointer;
            outline: none;
            margin: 0 auto;
        }
        .shutter-btn:active { transform: scale(0.90); }
        .shutter-inner { width: 24px; height: 24px; border: 3px solid #000; border-radius: 50%; }
        .photo-count { font-size: 13px; font-weight: 800; color: #2979ff; margin-top: 4px; }

        .submit-btn {
            background: #ff1744;
            color: #fff;
            font-weight: 900;
            border: none;
            border-radius: 14px;
            height: 60px;
            font-size: 24px;
            width: 100%;
            margin-top: 18px;
            cursor: pointer;
            box-shadow: 0 6px 20px rgba(255, 23, 68, 0.4);
            letter-spacing: 2px;
        }
        .submit-btn:active { transform: scale(0.97); }
        #status { text-align: center; font-weight: 800; font-size: 16px; margin-top: 12px; min-height: 24px; }
    </style>
</head>
<body>

<div class="header">
    <h1>TOW VEHICLE</h1>
</div>

<div class="card">
    <div class="rego-banner" id="regoVal">---</div>

    <!-- 1. LOCATION DROPDOWN (PRE-POPULATED OR MASTER FALLBACK) -->
    <label>Location (Towed From)</label>
    <select id="locationSelect">
        <option value="" disabled selected>SELECT LOCATION</option>
    </select>

    <!-- 2. MAKE DROPDOWN -->
    <label>Make</label>
    <select id="makeSelect">
        <option value="" selected>SELECT MAKE</option>
        <option value="Ford">Ford</option>
        <option value="GWM">GWM</option>
        <option value="Hyundai">Hyundai</option>
        <option value="Kia">Kia</option>
        <option value="Mazda">Mazda</option>
        <option value="MG">MG</option>
        <option value="Mitsubishi">Mitsubishi</option>
        <option value="Tesla">Tesla</option>
        <option value="Toyota">Toyota</option>
        <option value="OTHER">OTHER / CUSTOM</option>
    </select>
    <input type="text" id="makeCustom" class="custom-input" placeholder="ENTER MAKE">

    <!-- 3. MODEL (FREE TEXT CAPS) -->
    <label>Model</label>
    <input type="text" id="modelInput" placeholder="E.G. COROLLA">

    <!-- 4. COLOUR DROPDOWN -->
    <label>Colour</label>
    <select id="colourSelect">
        <option value="White" selected>White</option>
        <option value="Black">Black</option>
        <option value="Blue">Blue</option>
        <option value="Gold">Gold</option>
        <option value="Green">Green</option>
        <option value="Grey">Grey</option>
        <option value="Maroon">Maroon</option>
        <option value="Red">Red</option>
        <option value="Silver">Silver</option>
        <option value="Yellow">Yellow</option>
        <option value="OTHER">OTHER / CUSTOM</option>
    </select>
    <input type="text" id="colourCustom" class="custom-input" placeholder="ENTER COLOUR">

    <!-- 5. TYPE DROPDOWN -->
    <label>Type</label>
    <select id="typeSelect">
        <option value="Car" selected>Car</option>
        <option value="Sedan">Sedan</option>
        <option value="Station Wagon">Station Wagon</option>
        <option value="Hatchback">Hatchback</option>
        <option value="Utility">Utility</option>
        <option value="Van">Van</option>
        <option value="OTHER">OTHER / CUSTOM</option>
    </select>
    <input type="text" id="typeCustom" class="custom-input" placeholder="ENTER TYPE">

    <!-- 6. DRIVER DROPDOWN -->
    <label>Driver</label>
    <select id="driverSelect">
        <option value="Brett" selected>Brett</option>
        <option value="Brian">Brian</option>
    </select>

    <!-- LIVE CAMERA SNAP -->
    <label>Snap Condition Photos</label>
    <div class="camera-box">
        <video id="webcam" autoplay playsinline muted></video>
    </div>
    <div class="photo-controls">
        <button class="shutter-btn" id="snapBtn"><div class="shutter-inner"></div></button>
    </div>
    <div class="photo-count" id="photoCountText">0 PHOTOS CAPTURED</div>

    <button class="submit-btn" id="saveBtn">TOW</button>
    <div id="status"></div>
</div>

<canvas id="procCanvas" style="display:none;"></canvas>
<iframe name="hiddenTarget" id="hiddenTarget" style="display:none;"></iframe>
<form id="bypassForm" action="https://script.google.com/macros/s/AKfycbzoWD84FAwprSdWAZlm4YeyjU9ps3kTW_XXN_QMkTJxvm-LMrnFIZ2RzDLDShbV5ATK8g/exec" method="POST" target="hiddenTarget" style="display:none;">
    <input type="hidden" name="payload" id="formPayload">
</form>

<script>
    const GOOGLE_SCRIPT_URL = "https://script.google.com/macros/s/AKfycbzoWD84FAwprSdWAZlm4YeyjU9ps3kTW_XXN_QMkTJxvm-LMrnFIZ2RzDLDShbV5ATK8g/exec";
    const urlParams = new URLSearchParams(window.location.search);
    const passedProp = decodeURIComponent(urlParams.get('prop') || '');
    const rego = (urlParams.get('rego') || 'UNKNOWN').toUpperCase();

    document.getElementById('regoVal').innerText = rego;

    const locationSelect = document.getElementById('locationSelect');
    const makeSelect = document.getElementById('makeSelect');
    const makeCustom = document.getElementById('makeCustom');
    const colourSelect = document.getElementById('colourSelect');
    const colourCustom = document.getElementById('colourCustom');
    const typeSelect = document.getElementById('typeSelect');
    const typeCustom = document.getElementById('typeCustom');
    const video = document.getElementById('webcam');
    const snapBtn = document.getElementById('snapBtn');
    const photoCountText = document.getElementById('photoCountText');
    const saveBtn = document.getElementById('saveBtn');
    const statusDiv = document.getElementById('status');
    const canvas = document.getElementById('procCanvas');
    const ctx = canvas.getContext('2d');
    const bypassForm = document.getElementById('bypassForm');
    const formPayload = document.getElementById('formPayload');

    let capturedPhotos = [];

    window.addEventListener('load', async () => {
        initCamera();

        // Load property list from Master Log
        try {
            const res = await fetch(`${GOOGLE_SCRIPT_URL}?action=get_properties`);
            const props = await res.json();
            
            locationSelect.innerHTML = "";
            let matchFound = false;

            props.forEach(p => {
                const opt = document.createElement('option');
                opt.value = p.name;
                opt.innerText = p.name.toUpperCase();
                if (passedProp && p.name.toUpperCase() === passedProp.toUpperCase()) {
                    opt.selected = true;
                    matchFound = true;
                }
                locationSelect.appendChild(opt);
            });

            if (!matchFound && passedProp) {
                const opt = document.createElement('option');
                opt.value = passedProp;
                opt.innerText = passedProp.toUpperCase();
                opt.selected = true;
                locationSelect.prepend(opt);
            }
        } catch(e) {
            if (passedProp) {
                locationSelect.innerHTML = `<option value="${passedProp}" selected>${passedProp.toUpperCase()}</option>`;
            }
        }
    });

    async function initCamera() {
        try {
            const stream = await navigator.mediaDevices.getUserMedia({
                video: { facingMode: { exact: "environment" }, width: { ideal: 1280 }, height: { ideal: 720 } },
                audio: false
            });
            video.srcObject = stream;
        } catch (err) {
            try {
                const stream = await navigator.mediaDevices.getUserMedia({ video: true, audio: false });
                video.srcObject = stream;
            } catch(e) {
                photoCountText.innerText = "CAMERA ACCESS OFF";
            }
        }
    }

    makeSelect.addEventListener('change', () => makeCustom.style.display = (makeSelect.value === 'OTHER') ? 'block' : 'none');
    colourSelect.addEventListener('change', () => colourCustom.style.display = (colourSelect.value === 'OTHER') ? 'block' : 'none');
    typeSelect.addEventListener('change', () => typeCustom.style.display = (typeSelect.value === 'OTHER') ? 'block' : 'none');

    // Fast shutter tap
    snapBtn.addEventListener('click', () => {
        if (!video.videoWidth) return;

        canvas.width = 800;
        const scale = 800 / video.videoWidth;
        canvas.height = video.videoHeight * scale;
        ctx.drawImage(video, 0, 0, canvas.width, canvas.height);

        const dataUrl = canvas.toDataURL('image/jpeg', 0.65);
        capturedPhotos.push(dataUrl.split(',')[1]);

        photoCountText.innerText = `✔ ${capturedPhotos.length} PHOTO${capturedPhotos.length > 1 ? 'S' : ''} CAPTURED`;
        
        // Brief white flash effect on snap
        video.style.opacity = '0.3';
        setTimeout(() => video.style.opacity = '1', 100);
    });

    saveBtn.addEventListener('click', () => {
        const finalMake = (makeSelect.value === 'OTHER') ? makeCustom.value.trim() : makeSelect.value;
        const finalColour = (colourSelect.value === 'OTHER') ? colourCustom.value.trim() : colourSelect.value;
        const finalType = (typeSelect.value === 'OTHER') ? typeCustom.value.trim() : typeSelect.value;
        const finalModel = document.getElementById('modelInput').value.trim().toUpperCase();

        statusDiv.style.color = "#ff1744";
        statusDiv.innerText = "LOGGING TOW & CREATING DRIVE FOLDERS...";

        const payloadObj = {
            "action": "commit_tow",
            "propertyName": locationSelect.value,
            "rego": rego,
            "make": finalMake,
            "model": finalModel,
            "colour": finalColour,
            "type": finalType,
            "driver": document.getElementById('driverSelect').value,
            "images": capturedPhotos
        };

        formPayload.value = JSON.stringify(payloadObj);
        bypassForm.submit();

        setTimeout(() => {
            statusDiv.style.color = "#00e676";
            statusDiv.innerText = "✔ TOW LOGGED TO YARD LOG!";
            setTimeout(() => {
                window.location.href = "tow.html";
            }, 1800);
        }, 1200);
    });
</script>

</body>
</html>
