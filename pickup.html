<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>TOW VEHICLE</title>
    
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="TOW">
    
    <link rel="apple-touch-icon" href="icon-tow.png?v=1">
    <link rel="icon" type="image/png" href="icon-tow.png?v=1">
    <link rel="manifest" href="manifest-pickup.json?v=1">

    <style>
        * { box-sizing: border-box; }
        body { 
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; 
            margin: 0; 
            padding: 16px; 
            background: #121212; 
            color: #fff; 
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            -webkit-user-select: none;
        }
        .header {
            text-align: center;
            margin-top: 10px;
            margin-bottom: 20px;
            width: 100%;
            max-width: 440px;
        }
        .header h1 {
            margin: 0;
            font-size: 38px;
            font-weight: 900;
            color: #ff1744;
            letter-spacing: 3px;
        }
        .card {
            background: #1e1e1e;
            border-radius: 18px;
            padding: 24px;
            width: 100%;
            max-width: 440px;
            border: 1px solid #2a2a2a;
            box-shadow: 0 6px 20px rgba(0,0,0,0.6);
            text-align: center;
        }
        .info-box {
            background: #2a2a2a;
            border-radius: 12px;
            padding: 12px;
            margin-bottom: 16px;
            border: 1px solid #333;
        }
        .rego-display {
            font-size: 32px;
            font-weight: 900;
            color: #00e676;
            letter-spacing: 2px;
        }
        .prop-display {
            font-size: 14px;
            font-weight: 800;
            color: #aaa;
            text-transform: uppercase;
            margin-top: 4px;
        }
        label {
            font-size: 13px;
            text-transform: uppercase;
            color: #aaa;
            display: block;
            margin-top: 14px;
            font-weight: 800;
            letter-spacing: 1px;
            text-align: center;
        }
        input, select {
            width: 100%;
            height: 56px;
            padding: 0 16px;
            border-radius: 12px;
            border: 1px solid #333;
            background: #2a2a2a;
            color: #fff;
            font-size: 20px;
            font-weight: 700;
            margin-top: 6px;
            outline: none;
            box-sizing: border-box;
            text-align: center;
            text-align-last: center;
        }
        input[type="text"] {
            text-transform: uppercase;
            color: #00e676;
        }
        .photo-btn {
            background: #2979ff;
            color: #fff;
            font-weight: 900;
            border: none;
            border-radius: 12px;
            height: 54px;
            font-size: 18px;
            width: 100%;
            margin-top: 20px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
        }
        .photo-btn:active { transform: scale(0.97); }
        .submit-btn {
            background: #ff1744;
            color: #fff;
            font-weight: 900;
            border: none;
            border-radius: 14px;
            height: 64px;
            font-size: 26px;
            width: 100%;
            margin-top: 28px;
            cursor: pointer;
            box-shadow: 0 6px 20px rgba(255, 23, 68, 0.4);
            letter-spacing: 2px;
        }
        .submit-btn:active { transform: scale(0.97); }
        #status {
            text-align: center;
            font-weight: 800;
            font-size: 18px;
            margin-top: 18px;
            min-height: 28px;
        }
        #photoPreview {
            width: 100%;
            max-height: 180px;
            object-fit: cover;
            border-radius: 12px;
            margin-top: 12px;
            display: none;
            border: 2px solid #2979ff;
        }
    </style>
</head>
<body>

<div class="header">
    <h1>TOW VEHICLE</h1>
</div>

<div class="card">
    <div class="info-box">
        <div class="rego-display" id="regoVal">---</div>
        <div class="prop-display" id="propVal">---</div>
    </div>

    <label>Make</label>
    <input type="text" id="makeInput" list="makesList" placeholder="SELECT OR TYPE MAKE">
    <datalist id="makesList">
        <option value="Ford"><option value="GWM"><option value="Hyundai">
        <option value="Kia"><option value="Mazda"><option value="MG">
        <option value="Mitsubishi"><option value="Tesla"><option value="Toyota">
    </datalist>

    <label>Model</label>
    <input type="text" id="modelInput" placeholder="E.G. COROLLA">

    <label>Colour</label>
    <input type="text" id="colourInput" list="coloursList" value="White">
    <datalist id="coloursList">
        <option value="Black"><option value="Blue"><option value="Gold">
        <option value="Green"><option value="Grey"><option value="Maroon">
        <option value="Red"><option value="Silver"><option value="White"><option value="Yellow">
    </datalist>

    <label>Type</label>
    <input type="text" id="typeInput" list="typesList" value="Car">
    <datalist id="typesList">
        <option value="Sedan"><option value="Station Wagon"><option value="Hatchback">
        <option value="Utility"><option value="Van">
    </datalist>

    <label>Driver</label>
    <select id="driverSelect">
        <option value="Brett">Brett</option>
        <option value="Brian">Brian</option>
    </select>

    <button class="photo-btn" id="photoTrigger">📷 RECORD CONDITION</button>
    <input type="file" id="cameraInput" accept="image/*" capture="environment" style="display:none;">
    <img id="photoPreview">

    <button class="submit-btn" id="saveBtn">TOW</button>
    <div id="status"></div>
</div>

<canvas id="procCanvas" style="display:none;"></canvas>
<iframe name="hiddenTarget" id="hiddenTarget" style="display:none;"></iframe>
<form id="bypassForm" action="https://script.google.com/macros/s/AKfycbzoWD84FAwprSdWAZlm4YeyjU9ps3kTW_XXN_QMkTJxvm-LMrnFIZ2RzDLDShbV5ATK8g/exec" method="POST" target="hiddenTarget" style="display:none;">
    <input type="hidden" name="payload" id="formPayload">
</form>

<script>
    const urlParams = new URLSearchParams(window.location.search);
    const propertyName = decodeURIComponent(urlParams.get('prop') || 'GENERAL');
    const rego = (urlParams.get('rego') || 'UNKNOWN').toUpperCase();

    document.getElementById('regoVal').innerText = rego;
    document.getElementById('propVal').innerText = propertyName;

    const cameraInput = document.getElementById('cameraInput');
    const photoTrigger = document.getElementById('photoTrigger');
    const photoPreview = document.getElementById('photoPreview');
    const saveBtn = document.getElementById('saveBtn');
    const statusDiv = document.getElementById('status');
    const canvas = document.getElementById('procCanvas');
    const ctx = canvas.getContext('2d');
    const bypassForm = document.getElementById('bypassForm');
    const formPayload = document.getElementById('formPayload');

    let capturedBase64 = "";

    photoTrigger.addEventListener('click', () => cameraInput.click());

    cameraInput.addEventListener('change', (e) => {
        const file = e.target.files[0];
        if (!file) return;

        const reader = new FileReader();
        reader.onload = (event) => {
            const img = new Image();
            img.onload = () => {
                canvas.width = 800;
                const scale = 800 / img.width;
                canvas.height = img.height * scale;
                ctx.drawImage(img, 0, 0, canvas.width, canvas.height);

                const dataUrl = canvas.toDataURL('image/jpeg', 0.65);
                capturedBase64 = dataUrl.split(',')[1];

                photoPreview.src = dataUrl;
                photoPreview.style.display = "block";
                photoTrigger.innerText = "✔ CONDITION PHOTO ATTACHED";
                photoTrigger.style.background = "#388e3c";
            };
            img.src = event.target.result;
        };
        reader.readAsDataURL(file);
    });

    saveBtn.addEventListener('click', () => {
        statusDiv.style.color = "#ff1744";
        statusDiv.innerText = "LOGGING TOW & CREATING DRIVE FOLDERS...";

        const payloadObj = {
            "action": "commit_tow",
            "propertyName": propertyName,
            "rego": rego,
            "make": document.getElementById('makeInput').value.trim(),
            "model": document.getElementById('modelInput').value.trim(),
            "colour": document.getElementById('colourInput').value.trim(),
            "type": document.getElementById('typeInput').value.trim(),
            "driver": document.getElementById('driverSelect').value,
            "imageBytes": capturedBase64
        };

        formPayload.value = JSON.stringify(payloadObj);
        bypassForm.submit();

        setTimeout(() => {
            statusDiv.style.color = "#00e676";
            statusDiv.innerText = "✔ TOW LOGGED TO YARD LOG!";
            setTimeout(() => {
                window.location.href = "tow.html";
            }, 1800);
        }, 1200);
    });
</script>

</body>
</html>
