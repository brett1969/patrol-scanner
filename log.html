<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>MASTER LOG</title>
    
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="LOG">
    
    <link rel="apple-touch-icon" href="icon-log.png?v=1">
    <link rel="icon" type="image/png" href="icon-log.png?v=1">
    <link rel="manifest" href="manifest-log.json?v=1">

    <style>
        * { box-sizing: border-box; }
        body { 
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; 
            margin: 0; 
            padding: 24px; 
            background: #121212; 
            color: #fff; 
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            text-align: center;
            -webkit-user-select: none;
        }
        .header h1 {
            margin: 0;
            font-size: 36px;
            font-weight: 900;
            color: #00e676;
            letter-spacing: 3px;
        }
        .sub-text {
            color: #aaa;
            font-size: 15px;
            font-weight: 700;
            margin-top: 10px;
            margin-bottom: 30px;
        }
        .open-btn {
            background: #00e676;
            color: #000;
            font-weight: 900;
            border: none;
            border-radius: 16px;
            height: 68px;
            font-size: 22px;
            width: 100%;
            max-width: 380px;
            display: flex;
            align-items: center;
            justify-content: center;
            text-decoration: none;
            box-shadow: 0 6px 20px rgba(0, 230, 118, 0.4);
            letter-spacing: 1px;
        }
        .open-btn:active { transform: scale(0.96); }
    </style>
</head>
<body>

<div class="header">
    <h1>MASTER LOG</h1>
</div>
<div class="sub-text">Opening Tow Logs Spreadsheet...</div>

<a id="sheetLink" href="googlesheets://docs.google.com/spreadsheets/d/1c5_t0x2e_Gtsqn1M_pRI4WPA1qdLApQyA0eJitIpkI8/edit" class="open-btn">OPEN WORKBOOK ↗</a>

<script>
    const SHEET_ID = "1c5_t0x2e_Gtsqn1M_pRI4WPA1qdLApQyA0eJitIpkI8";
    const appUrl = `googlesheets://docs.google.com/spreadsheets/d/${SHEET_ID}/edit`;
    const webUrl = `https://docs.google.com/spreadsheets/d/${SHEET_ID}/edit`;

    window.addEventListener('load', () => {
        // Attempt immediate deep-link jump to the Google Sheets App
        window.location.href = appUrl;

        // Fallback to Web URL if app is not installed
        setTimeout(() => {
            document.getElementById('sheetLink').href = webUrl;
        }, 1200);
    });
</script>

</body>
</html>
