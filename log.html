<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>MASTER LOG</title>
    
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="LOG">
    
    <link rel="apple-touch-icon" href="icon-log.png?v=1">
    <link rel="icon" type="image/png" href="icon-log.png?v=1">
    <link rel="manifest" href="manifest-log.json?v=1">

    <style>
        * { box-sizing: border-box; }
        html, body { 
            margin: 0; 
            padding: 0; 
            width: 100%; 
            height: 100%; 
            background: #121212; 
            color: #fff; 
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            overflow: hidden;
            display: flex;
            flex-direction: column;
        }
        .header {
            background: #1e1e1e;
            padding: 10px 16px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            border-bottom: 1px solid #2a2a2a;
            height: 56px;
            flex-shrink: 0;
        }
        .header h1 {
            margin: 0;
            font-size: 20px;
            font-weight: 900;
            color: #00e676;
            letter-spacing: 2px;
        }
        .open-btn {
            background: #2a2a2a;
            color: #00e676;
            border: 1px solid #333;
            border-radius: 8px;
            padding: 6px 12px;
            font-size: 12px;
            font-weight: 800;
            text-decoration: none;
            cursor: pointer;
        }
        .open-btn:active { transform: scale(0.95); }
        .iframe-container {
            flex-grow: 1;
            width: 100%;
            height: calc(100% - 56px);
            background: #ffffff;
        }
        iframe {
            width: 100%;
            height: 100%;
            border: none;
        }
    </style>
</head>
<body>

<div class="header">
    <h1>MASTER LOG</h1>
    <!-- Opens directly in Google Sheets app if installed on phone -->
    <a href="https://docs.google.com/spreadsheets/d/1c5_t0x2e_Gtsqn1M_pRI4WPA1qdLApQyA0eJitIpkI8/edit" target="_blank" class="open-btn">OPEN APP ↗</a>
</div>

<div class="iframe-container">
    <iframe src="https://docs.google.com/spreadsheets/d/1c5_t0x2e_Gtsqn1M_pRI4WPA1qdLApQyA0eJitIpkI8/edit?rm=minimal" allow="clipboard-read; clipboard-write"></iframe>
</div>

</body>
</html>
