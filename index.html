<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>MARK CAR</title>
    
    <!-- PWA Directives -->
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="MARK">
    
    <!-- Embedded "MARK" Tile Icon -->
    <link rel="apple-touch-icon" href="data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 512 512' width='512' height='512'><rect width='512' height='512' rx='115' fill='%231c1c1e'/><rect x='30' y='30' width='452' height='452' rx='95' fill='url(%23grad)'/><defs><linearGradient id='grad' x1='0%25' y1='0%25' x2='0%25' y2='100%25'><stop offset='0%25' stop-color='%232c2c2e'/><stop offset='100%25' stop-color='%23121212'/></linearGradient></defs><text x='50%25' y='62%25' font-family='-apple-system, BlinkMacSystemFont, Arial, sans-serif' font-size='110' font-weight='900' fill='%2300e676' text-anchor='middle'>MARK</text></svg>">
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 512 512' width='512' height='512'><rect width='512' height='512' rx='115' fill='%231c1c1e'/><rect x='30' y='30' width='452' height='452' rx='95' fill='url(%23grad)'/><defs><linearGradient id='grad' x1='0%25' y1='0%25' x2='0%25' y2='100%25'><stop offset='0%25' stop-color='%232c2c2e'/><stop offset='100%25' stop-color='%23121212'/></linearGradient></defs><text x='50%25' y='62%25' font-family='-apple-system, BlinkMacSystemFont, Arial, sans-serif' font-size='110' font-weight='900' fill='%2300e676' text-anchor='middle'>MARK</text></svg>">
    <link rel="manifest" href="manifest-mark.json?v=1">

    <style>
        * { box-sizing: border-box; }
        body { 
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; 
            margin: 0; 
            padding: 12px; 
            background: #121212; 
            color: #fff; 
            -webkit-user-select: none;
            display: flex;
            flex-direction: column;
            align-items: center;
            height: 100vh;
            overflow: hidden;
        }
        .header {
            text-align: center;
            margin-top: 4px;
            margin-bottom: 8px;
        }
        .header h1 {
            margin: 0;
            font-size: 38px;
            font-weight: 900;
            color: #00e676;
            letter-spacing: 2px;
        }
        .location-card {
            background: #1e1e1e;
            border-radius: 14px;
            padding: 10px 14px;
            width: 100%;
            max-width: 420px;
            border: 1px solid #2a2a2a;
            margin-bottom: 8px;
            text-align: center;
        }
        .gps-badge {
            font-size: 10px;
            text-transform: uppercase;
            color: #888;
            font-weight: 700;
            margin-bottom: 4px;
            display: block;
        }
        .select-dropdown {
            width: 100%;
            padding: 10px;
            border-radius: 10px;
            border: 1px solid #333;
            background: #2a2a2a;
            color: #00e676;
            font-size: 18px;
            font-weight: 800;
            outline: none;
            text-align-last: center;
        }
        .viewfinder-box {
            position: relative;
            width: 100%;
            max-width: 420px;
            flex: 1;
            background: #000;
            border-radius: 16px;
            overflow: hidden;
            border: 2px solid #00e676;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        video, img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }
        .result-overlay {
            position: absolute;
            top: 12px;
            left: 12px;
            right: 12px;
            background: rgba(0,0,0,0.85);
            border: 2px solid #00e676;
            border-radius: 12px;
            padding: 10px;
            text-align: center;
            z-index: 10;
        }
        .rego-text {
            font-size: 34px;
            font-weight: 900;
            color: #00e676;
            letter-spacing: 3px;
        }
        .status-text {
            font-size: 12px;
            color: #fff;
            font-weight: 700;
            margin-top: 2px;
        }
        .controls {
            padding: 12px 0;
            display: flex;
            justify-content: center;
            width: 100%;
        }
        .shutter-btn {
            background: #00e676;
            border: 5px solid #fff;
            width: 96px;
            height: 96px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 6px 24px rgba(0, 230, 118, 0.6);
            cursor: pointer;
            outline: none;
        }
        .shutter-btn:active {
            transform: scale(0.90);
            background: #00c853;
        }
        .shutter-icon {
            width: 36px;
            height: 36px;
            border: 4px solid #000;
            border-radius: 50%;
        }
    </style>
</head>
<body>

<div class="header">
    <h1>MARK CAR</h1>
</div>

<div class="location-card">
    <span class="gps-badge" id="gpsBadge">DETECTING LOCATION...</span>
    <select id="propertySelect" class="select-dropdown">
        <option value="GENERAL PATROL">GENERAL PATROL</option>
    </select>
</div>

<div class="viewfinder-box">
    <video id="webcam" autoplay playsinline muted></video>
    <img id="freezeFrame" style="display:none;" />
    
    <div class="result-overlay">
        <div class="rego-text" id="rego">READY</div>
        <div class="status-text" id="status">TAP BUTTON TO SNAP</div>
    </div>
</div>

<div class="controls">
    <button class="shutter-btn" id="snapBtn">
        <div class="shutter-icon"></div>
    </button>
</div>

<canvas id="procCanvas" style="display:none;"></canvas>
<iframe name="hiddenTarget" id="hiddenTarget" style="display:none;"></iframe>
<form id="bypassForm" action="https://script.google.com/macros/s/AKfycbzoWD84FAwprSdWAZlm4YeyjU9ps3kTW_XXN_QMkTJxvm-LMrnFIZ2RzDLDShbV5ATK8g/exec" method="POST" target="hiddenTarget" style="display:none;">
    <input type="hidden" name="payload" id="formPayload">
</form>

<script>
    const GOOGLE_SCRIPT_URL = "https://script.google.com/macros/s/AKfycbzoWD84FAwprSdWAZlm4YeyjU9ps3kTW_XXN_QMkTJxvm-LMrnFIZ2RzDLDShbV5ATK8g/exec";
    const PLATE_RECOGNIZER_KEY = "74a8bb83a49461eef0266274ce63e1e198b4c888";
    
    let propertyDatabase = [];

    const video = document.getElementById('webcam');
    const freezeFrame = document.getElementById('freezeFrame');
    const snapBtn = document.getElementById('snapBtn');
    const statusText = document.getElementById('status');
    const gpsBadge = document.getElementById('gpsBadge');
    const regoDisplay = document.getElementById('rego');
    const propertySelect = document.getElementById('propertySelect');
    const canvas = document.getElementById('procCanvas');
    const ctx = canvas.getContext('2d');
    const bypassForm = document.getElementById('bypassForm');
    const formPayload = document.getElementById('formPayload');

    window.addEventListener('load', async () => {
        initCamera();

        try {
            const res = await fetch(`${GOOGLE_SCRIPT_URL}?action=get_properties`);
            propertyDatabase = await res.json();

            if (propertyDatabase && propertyDatabase.length > 0) {
                propertySelect.innerHTML = "";
                propertyDatabase.forEach(p => {
                    const opt = document.createElement('option');
                    opt.value = p.name;
                    opt.innerText = p.name.toUpperCase();
                    propertySelect.appendChild(opt);
                });
            }

            if (navigator.geolocation) {
                navigator.geolocation.getCurrentPosition(position => {
                    const userLat = position.coords.latitude;
                    const userLng = position.coords.longitude;
                    
                    let nearestProp = null;
                    let shortestDistance = Infinity;

                    propertyDatabase.forEach(p => {
                        if (p.lat && p.lng) {
                            const dist = getDistanceMeters(userLat, userLng, p.lat, p.lng);
                            if (dist < shortestDistance) {
                                shortestDistance = dist;
                                nearestProp = p;
                            }
                        }
                    });

                    if (nearestProp && shortestDistance <= (nearestProp.radius || 300)) {
                        propertySelect.value = nearestProp.name;
                        gpsBadge.innerText = "GPS LOCKED (NEAREST PROPERTY)";
                    } else {
                        gpsBadge.innerText = "GPS ACTIVE";
                    }
                });
            }
        } catch(e) {
            gpsBadge.innerText = "LOCATION OFFLINE";
        }
    });

    async function initCamera() {
        try {
            const stream = await navigator.mediaDevices.getUserMedia({
                video: { facingMode: { exact: "environment" }, width: { ideal: 1280 }, height: { ideal: 720 } },
                audio: false
            });
            video.srcObject = stream;
        } catch (err) {
            try {
                const stream = await navigator.mediaDevices.getUserMedia({ video: true, audio: false });
                video.srcObject = stream;
            } catch(e) {
                statusText.innerText = "ALLOW CAMERA PERMISSION";
            }
        }
    }

    function getDistanceMeters(lat1, lon1, lat2, lon2) {
        const R = 6371e3;
        const dLat = (lat2 - lat1) * Math.PI / 180;
        const dLon = (lon2 - lon1) * Math.PI / 180;
        const a = Math.sin(dLat/2) * Math.sin(dLat/2) +
                  Math.cos(lat1 * Math.PI / 180) * Math.cos(lat2 * Math.PI / 180) *
                  Math.sin(dLon/2) * Math.sin(dLon/2);
        return R * 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a));
    }

    snapBtn.addEventListener('click', async () => {
        if (!video.videoWidth) return;

        statusText.innerText = "⚡ READING PLATE...";
        regoDisplay.innerText = "READING...";

        canvas.width = 800;
        const scale = 800 / video.videoWidth;
        canvas.height = video.videoHeight * scale;
        ctx.drawImage(video, 0, 0, canvas.width, canvas.height);

        const dataUrl = canvas.toDataURL('image/jpeg', 0.65);
        const compressedBase64 = dataUrl.split(',')[1];

        freezeFrame.src = dataUrl;
        freezeFrame.style.display = "block";
        video.style.display = "none";

        let detectedRego = "UNREADABLE";
        let confidence = "LOW";
        let makeModel = "GENERAL";

        try {
            const startTime = performance.now();

            const byteCharacters = atob(compressedBase64);
            const byteNumbers = new Array(byteCharacters.length);
            for (let i = 0; i < byteCharacters.length; i++) {
                byteNumbers[i] = byteCharacters.charCodeAt(i);
            }
            const blob = new Blob([new Uint8Array(byteNumbers)], {type: 'image/jpeg'});

            let formData = new FormData();
            formData.append('upload', blob, 'snap.jpg');
            formData.append('regions', 'au');

            const anprRes = await fetch('https://api.platerecognizer.com/v1/plate-reader/', {
                method: 'POST',
                headers: { 'Authorization': `Token ${PLATE_RECOGNIZER_KEY}` },
                body: formData
            });

            const anprData = await anprRes.json();
            const elapsedSeconds = ((performance.now() - startTime) / 1000).toFixed(1);

            if (anprData.results && anprData.results.length > 0) {
                const topResult = anprData.results[0];
                detectedRego = topResult.plate.toUpperCase();
                confidence = (topResult.score > 0.8) ? "HIGH" : "LOW";

                if (topResult.vehicle && topResult.vehicle.make) {
                    makeModel = `${topResult.vehicle.make} ${topResult.vehicle.model || ''}`.trim().toUpperCase();
                }
            }

            regoDisplay.innerText = detectedRego;
            statusText.innerText = `✔ MARKED (${elapsedSeconds}s)`;

        } catch(err) {
            regoDisplay.innerText = "UNREADABLE";
            statusText.innerText = "MARKED (CHECK PLATE)";
        }

        const payloadObj = {
            "action": "patrol_upload",
            "propertyName": propertySelect.value || "GENERAL PATROL",
            "rego": detectedRego,
            "confidence": confidence,
            "makeModel": makeModel,
            "imageBytes": compressedBase64
        };

        formPayload.value = JSON.stringify(payloadObj);
        bypassForm.submit();

        setTimeout(() => {
            freezeFrame.style.display = "none";
            video.style.display = "block";
            statusText.innerText = "READY FOR NEXT CAR";
        }, 1800);
    });
</script>

</body>
</html>
