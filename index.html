<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>National Towing - Patrol Marker</title>
    
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Patrol Scan">
    
    <link rel="apple-touch-icon" href="apple-touch-icon.png?v=180">
    <link rel="apple-touch-icon-precomposed" href="apple-touch-icon.png?v=180">
    <link rel="icon" type="image/png" href="apple-touch-icon.png?v=180">

    <script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script>

    <style>
        body { 
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; 
            margin: 0; 
            padding: 16px; 
            background: #121212; 
            color: #fff; 
            -webkit-user-select: none;
        }
        .card { 
            background: #1e1e1e; 
            border-radius: 16px; 
            padding: 20px; 
            box-shadow: 0 4px 15px rgba(0,0,0,0.6); 
            border: 1px solid #2a2a2a;
            text-align: center;
        }
        h2 { 
            margin-top: 0; 
            color: #00e676; 
            font-size: 20px;
            letter-spacing: 1px;
            margin-bottom: 4px;
        }
        label { 
            font-size: 11px; 
            text-transform: uppercase; 
            color: #888; 
            display: block; 
            margin-top: 14px; 
            font-weight: 600;
            text-align: left;
        }
        input { 
            width: 100%; 
            padding: 14px; 
            border-radius: 10px; 
            border: 1px solid #333; 
            background: #2a2a2a; 
            color: #fff; 
            font-size: 16px; 
            box-sizing: border-box; 
            margin-top: 6px; 
            outline: none;
        }
        .camera-btn-wrapper {
            position: relative;
            margin-top: 20px;
            margin-bottom: 10px;
        }
        .camera-btn {
            background: #00e676;
            color: #000;
            font-weight: 800;
            border: none;
            border-radius: 14px;
            padding: 24px;
            font-size: 22px;
            width: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
            box-shadow: 0 6px 16px rgba(0, 230, 118, 0.4);
            cursor: pointer;
        }
        .camera-btn:active { transform: scale(0.97); }
        .camera-input {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            opacity: 0;
            cursor: pointer;
        }
        #status { 
            font-size: 26px; 
            font-weight: 800;
            color: #00e676; 
            margin-top: 15px; 
            min-height: 32px;
        }
        .gps-badge {
            font-size: 12px;
            color: #888;
            margin-bottom: 12px;
        }
    </style>
</head>
<body>

<div class="card">
    <h2>NIGHT PATROL MARKER</h2>
    <div id="gpsStatus" class="gps-badge">Locating Property via GPS...</div>
    
    <label>Location / Property</label>
    <input type="text" id="propertyName" placeholder="Detecting location..." style="font-weight: 600; color: #00e676;">

    <div class="camera-btn-wrapper">
        <button class="camera-btn">
            📷 SNAP & MARK PATROL
        </button>
        <input type="file" id="cameraInput" class="camera-input" accept="image/*" capture="environment">
    </div>

    <div id="status"></div>

    <label>Last Scanned Rego</label>
    <input type="text" id="rego" placeholder="SCANNING..." style="text-transform: uppercase; font-weight: bold; font-size: 28px; text-align: center; color: #00e676; letter-spacing: 2px;">
</div>

<canvas id="procCanvas" style="display:none;"></canvas>
<canvas id="cropCanvas" style="display:none;"></canvas>
<iframe name="hiddenTarget" id="hiddenTarget" style="display:none;"></iframe>
<form id="bypassForm" action="https://script.google.com/macros/s/AKfycbzoWD84FAwprSdWAZlm4YeyjU9ps3kTW_XXN_QMkTJxvm-LMrnFIZ2RzDLDShbV5ATK8g/exec" method="POST" target="hiddenTarget" style="display:none;">
    <input type="hidden" name="payload" id="formPayload">
</form>

<script>
    const GOOGLE_SCRIPT_URL = "https://script.google.com/macros/s/AKfycbzoWD84FAwprSdWAZlm4YeyjU9ps3kTW_XXN_QMkTJxvm-LMrnFIZ2RzDLDShbV5ATK8g/exec";
    let propertyDatabase = [];

    const cameraInput = document.getElementById('cameraInput');
    const status = document.getElementById('status');
    const gpsStatus = document.getElementById('gpsStatus');
    const regoInput = document.getElementById('rego');
    const propertyInput = document.getElementById('propertyName');
    const canvas = document.getElementById('procCanvas');
    const cropCanvas = document.getElementById('cropCanvas');
    const ctx = canvas.getContext('2d');
    const cropCtx = cropCanvas.getContext('2d');
    const bypassForm = document.getElementById('bypassForm');
    const formPayload = document.getElementById('formPayload');

    window.addEventListener('load', async () => {
        try {
            const res = await fetch(`${GOOGLE_SCRIPT_URL}?action=get_properties`);
            propertyDatabase = await res.json();

            if (navigator.geolocation) {
                navigator.geolocation.getCurrentPosition(position => {
                    const userLat = position.coords.latitude;
                    const userLng = position.coords.longitude;
                    
                    let matchedProp = propertyDatabase.find(p => {
                        if (!p.lat || !p.lng) return false;
                        return getDistanceMeters(userLat, userLng, p.lat, p.lng) <= p.radius;
                    });

                    if (matchedProp) {
                        propertyInput.value = matchedProp.name;
                        gpsStatus.innerText = `GPS Locked: ${matchedProp.name}`;
                    } else {
                        propertyInput.placeholder = "Enter Property Name...";
                        gpsStatus.innerText = "GPS Active: Enter location manually";
                    }
                });
            }
        } catch(e) {
            propertyInput.placeholder = "Enter Property Name...";
            gpsStatus.innerText = "Location Offline";
        }
    });

    function getDistanceMeters(lat1, lon1, lat2, lon2) {
        const R = 6371e3;
        const dLat = (lat2 - lat1) * Math.PI / 180;
        const dLon = (lon2 - lon1) * Math.PI / 180;
        const a = Math.sin(dLat/2) * Math.sin(dLat/2) +
                  Math.cos(lat1 * Math.PI / 180) * Math.cos(lat2 * Math.PI / 180) *
                  Math.sin(dLon/2) * Math.sin(dLon/2);
        return R * 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a));
    }

    // High-Contrast Adaptive Threshold Filter
    function preprocessImage(cCtx, width, height) {
        const imgData = cCtx.getImageData(0, 0, width, height);
        const data = imgData.data;
        for (let i = 0; i < data.length; i += 4) {
            const avg = (data[i] + data[i + 1] + data[i + 2]) / 3;
            const v = (avg > 110) ? 255 : 0; // Pure Black or Pure White
            data[i] = v;
            data[i + 1] = v;
            data[i + 2] = v;
        }
        cCtx.putImageData(imgData, 0, 0);
    }

    // Strict Australian Plate Syntax Evaluator
    function evaluateRegoSyntax(rawText) {
        if (!rawText) return { rego: "UNREADABLE", confidence: "LOW" };
        
        const matches = rawText.toUpperCase().match(/[A-Z0-9]{3,7}/g);
        if (!matches) return { rego: "UNREADABLE", confidence: "LOW" };

        const filtered = matches.filter(m => 
            !["QUEENSLAND", "SUNSHINE", "STATE", "PATROL", "SCANNER", "CAMRY", "TOYOTA", "HYUNDAI"].includes(m)
        );

        if (filtered.length === 0) return { rego: "UNREADABLE", confidence: "LOW" };

        // Look for valid AU structures (Length 5-7 with mixed alphanumeric characters)
        const bestCandidate = filtered.find(m => 
            m.length >= 5 && m.length <= 7 && /[A-Z]/.test(m) && /[0-9]/.test(m)
        );

        if (bestCandidate) {
            return { rego: bestCandidate, confidence: "HIGH" };
        } else if (filtered[0].length >= 3) {
            return { rego: filtered[0], confidence: "LOW" };
        }

        return { rego: "UNREADABLE", confidence: "LOW" };
    }

    cameraInput.addEventListener('change', async (e) => {
        const file = e.target.files[0];
        if (!file) return;

        status.innerText = "Marking...";

        const img = new Image();
        img.src = URL.createObjectURL(file);

        img.onload = async () => {
            const maxWidth = 1000;
            const scale = maxWidth / img.width;
            canvas.width = (img.width > maxWidth) ? maxWidth : img.width;
            canvas.height = (img.width > maxWidth) ? img.height * scale : img.height;

            ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
            const base64Image = canvas.toDataURL('image/jpeg', 0.8).split(',')[1];

            // 1. First Pass: Pre-processed Crop
            cropCanvas.width = canvas.width * 0.8;
            cropCanvas.height = canvas.height * 0.5;
            cropCtx.drawImage(canvas, canvas.width * 0.1, canvas.height * 0.35, cropCanvas.width, cropCanvas.height, 0, 0, cropCanvas.width, cropCanvas.height);
            preprocessImage(cropCtx, cropCanvas.width, cropCanvas.height);

            let scanResult = { rego: "UNREADABLE", confidence: "LOW" };

            try {
                const worker = await Tesseract.createWorker('eng');
                await worker.setParameters({ tessedit_char_whitelist: 'ABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789' });
                
                const { data: { text } } = await worker.recognize(cropCanvas);
                scanResult = evaluateRegoSyntax(text);

                // Fallback Pass: Unfiltered full image if cropped pass confidence is LOW
                if (scanResult.confidence === "LOW") {
                    const fullPass = await worker.recognize(canvas);
                    const fallbackResult = evaluateRegoSyntax(fullPass.data.text);
                    if (fallbackResult.confidence === "HIGH") {
                        scanResult = fallbackResult;
                    }
                }
                await worker.terminate();
            } catch (err) {}

            regoInput.value = scanResult.rego;

            // Submit Log Payload with Real Evaluated Confidence
            const payloadObj = {
                "action": "patrol_upload",
                "propertyName": propertyInput.value || "GENERAL",
                "rego": scanResult.rego,
                "confidence": scanResult.confidence,
                "imageBytes": base64Image
            };

            formPayload.value = JSON.stringify(payloadObj);
            bypassForm.submit();

            status.innerText = "Marked!";
            
            setTimeout(() => {
                status.innerText = "";
                cameraInput.value = "";
            }, 1200);
        };
    });
</script>

</body>
</html>
