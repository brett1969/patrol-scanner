<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>MARK CAR</title>
    
    <!-- PWA Directives -->
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Mark Car">
    
    <link rel="apple-touch-icon" href="apple-touch-icon.png?v=470">
    <link rel="icon" type="image/png" href="apple-touch-icon.png?v=470">

    <style>
        * { box-sizing: border-box; }
        body { 
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; 
            margin: 0; 
            padding: 16px; 
            background: #121212; 
            color: #fff; 
            -webkit-user-select: none;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
        }
        .header {
            text-align: center;
            margin-top: 8px;
            margin-bottom: 16px;
        }
        .header h1 {
            margin: 0;
            font-size: 40px; /* Larger Font */
            font-weight: 900;
            color: #00e676;
            letter-spacing: 3px;
        }
        .card {
            background: #1e1e1e;
            border-radius: 18px;
            padding: 20px;
            width: 100%;
            max-width: 420px;
            border: 1px solid #2a2a2a;
            box-shadow: 0 6px 20px rgba(0,0,0,0.6);
            text-align: center;
        }
        label {
            font-size: 11px;
            text-transform: uppercase;
            color: #888;
            display: block;
            margin-top: 10px;
            font-weight: 700;
            text-align: left;
        }
        .select-dropdown {
            width: 100%;
            padding: 16px;
            border-radius: 12px;
            border: 1px solid #333;
            background: #2a2a2a;
            color: #00e676;
            font-size: 20px;
            font-weight: 800;
            margin-top: 6px;
            outline: none;
            appearance: none;
            -webkit-appearance: none;
            text-align-last: center;
        }
        .result-box {
            margin-top: 20px;
            background: #121212;
            border: 2px solid #00e676;
            border-radius: 14px;
            padding: 16px;
        }
        .rego-text {
            font-size: 36px;
            font-weight: 900;
            color: #00e676;
            letter-spacing: 3px;
        }
        .status-text {
            font-size: 13px;
            color: #888;
            font-weight: 600;
            margin-top: 4px;
        }
        /* Floating Bottom Camera Icon Button */
        .camera-btn-wrapper {
            position: fixed;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 999;
        }
        .camera-btn {
            background: #00e676;
            color: #000;
            border: none;
            width: 88px;
            height: 88px;
            border-radius: 50%;
            font-size: 42px;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 8px 25px rgba(0, 230, 118, 0.6);
            cursor: pointer;
        }
        .camera-btn:active {
            transform: scale(0.92);
        }
        .camera-input {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            opacity: 0;
            cursor: pointer;
        }
    </style>
</head>
<body>

<div class="header">
    <h1>MARK CAR</h1>
</div>

<div class="card">
    <label id="gpsBadge">DETECTING LOCATION VIA GPS...</label>
    <select id="propertySelect" class="select-dropdown">
        <option value="GENERAL PATROL">GENERAL PATROL</option>
    </select>

    <div class="result-box">
        <div class="rego-text" id="rego">READY</div>
        <div class="status-text" id="status">TAP CAMERA BUTTON TO SNAP</div>
    </div>
</div>

<!-- Bottom Camera Icon Button -->
<div class="camera-btn-wrapper">
    <button class="camera-btn">📷</button>
    <input type="file" id="cameraInput" class="camera-input" accept="image/*" capture="environment">
</div>

<canvas id="procCanvas" style="display:none;"></canvas>
<iframe name="hiddenTarget" id="hiddenTarget" style="display:none;"></iframe>
<form id="bypassForm" action="https://script.google.com/macros/s/AKfycbzoWD84FAwprSdWAZlm4YeyjU9ps3kTW_XXN_QMkTJxvm-LMrnFIZ2RzDLDShbV5ATK8g/exec" method="POST" target="hiddenTarget" style="display:none;">
    <input type="hidden" name="payload" id="formPayload">
</form>

<script>
    const GOOGLE_SCRIPT_URL = "https://script.google.com/macros/s/AKfycbzoWD84FAwprSdWAZlm4YeyjU9ps3kTW_XXN_QMkTJxvm-LMrnFIZ2RzDLDShbV5ATK8g/exec";
    const PLATE_RECOGNIZER_KEY = "74a8bb83a49461eef0266274ce63e1e198b4c888";
    
    let propertyDatabase = [];

    const cameraInput = document.getElementById('cameraInput');
    const statusText = document.getElementById('status');
    const gpsBadge = document.getElementById('gpsBadge');
    const regoDisplay = document.getElementById('rego');
    const propertySelect = document.getElementById('propertySelect');
    const canvas = document.getElementById('procCanvas');
    const ctx = canvas.getContext('2d');
    const bypassForm = document.getElementById('bypassForm');
    const formPayload = document.getElementById('formPayload');

    // 1. AUTO-LOAD PROPERTIES & GEOLOCATE NEAREST
    window.addEventListener('load', async () => {
        try {
            const res = await fetch(`${GOOGLE_SCRIPT_URL}?action=get_properties`);
            propertyDatabase = await res.json();

            if (propertyDatabase && propertyDatabase.length > 0) {
                propertySelect.innerHTML = "";
                propertyDatabase.forEach(p => {
                    const opt = document.createElement('option');
                    opt.value = p.name;
                    opt.innerText = p.name.toUpperCase();
                    propertySelect.appendChild(opt);
                });
            }

            if (navigator.geolocation) {
                navigator.geolocation.getCurrentPosition(position => {
                    const userLat = position.coords.latitude;
                    const userLng = position.coords.longitude;
                    
                    let nearestProp = null;
                    let shortestDistance = Infinity;

                    propertyDatabase.forEach(p => {
                        if (p.lat && p.lng) {
                            const dist = getDistanceMeters(userLat, userLng, p.lat, p.lng);
                            if (dist < shortestDistance) {
                                shortestDistance = dist;
                                nearestProp = p;
                            }
                        }
                    });

                    if (nearestProp && shortestDistance <= (nearestProp.radius || 300)) {
                        propertySelect.value = nearestProp.name;
                        gpsBadge.innerText = "GPS LOCKED (NEAREST PROPERTY)";
                    } else {
                        gpsBadge.innerText = "GPS ACTIVE (SELECT PROPERTY IF NEEDED)";
                    }
                });
            }
        } catch(e) {
            gpsBadge.innerText = "LOCATION OFFLINE";
        }
    });

    function getDistanceMeters(lat1, lon1, lat2, lon2) {
        const R = 6371e3;
        const dLat = (lat2 - lat1) * Math.PI / 180;
        const dLon = (lon2 - lon1) * Math.PI / 180;
        const a = Math.sin(dLat/2) * Math.sin(dLat/2) +
                  Math.cos(lat1 * Math.PI / 180) * Math.cos(lat2 * Math.PI / 180) *
                  Math.sin(dLon/2) * Math.sin(dLon/2);
        return R * 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a));
    }

    // 2. RELIABLE SNAP & CLOUD ANPR PASS
    cameraInput.addEventListener('change', async (e) => {
        const file = e.target.files[0];
        if (!file) return;

        statusText.innerText = "⚡ ANALYZING PLATE...";
        regoDisplay.innerText = "READING...";

        const img = new Image();
        img.src = URL.createObjectURL(file);

        img.onload = async () => {
            const maxWidth = 800;
            const scale = maxWidth / img.width;
            canvas.width = (img.width > maxWidth) ? maxWidth : img.width;
            canvas.height = (img.width > maxWidth) ? img.height * scale : img.height;

            ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
            const compressedBase64 = canvas.toDataURL('image/jpeg', 0.65).split(',')[1];

            let detectedRego = "UNREADABLE";
            let confidence = "LOW";
            let makeModel = "GENERAL";

            // Direct sub-second ANPR call
            try {
                const startTime = performance.now();
                
                let formData = new FormData();
                formData.append('upload', file);
                formData.append('regions', 'au');

                const anprRes = await fetch('https://api.platerecognizer.com/v1/plate-reader/', {
                    method: 'POST',
                    headers: { 'Authorization': `Token ${PLATE_RECOGNIZER_KEY}` },
                    body: formData
                });

                const anprData = await anprRes.json();
                const elapsedSeconds = ((performance.now() - startTime) / 1000).toFixed(1);

                if (anprData.results && anprData.results.length > 0) {
                    const topResult = anprData.results[0];
                    detectedRego = topResult.plate.toUpperCase();
                    confidence = (topResult.score > 0.8) ? "HIGH" : "LOW";

                    if (topResult.vehicle && topResult.vehicle.make) {
                        makeModel = `${topResult.vehicle.make} ${topResult.vehicle.model || ''}`.trim().toUpperCase();
                    }
                }

                regoDisplay.innerText = detectedRego;
                statusText.innerText = `✔ MARKED (${elapsedSeconds}s)`;

            } catch(err) {
                regoDisplay.innerText = "UNREADABLE";
                statusText.innerText = "MARKED (CHECK PLATE)";
            }

            // Background logging
            const payloadObj = {
                "action": "patrol_upload",
                "propertyName": propertySelect.value || "GENERAL PATROL",
                "rego": detectedRego,
                "confidence": confidence,
                "makeModel": makeModel,
                "imageBytes": compressedBase64
            };

            formPayload.value = JSON.stringify(payloadObj);
            bypassForm.submit();

            setTimeout(() => {
                statusText.innerText = "TAP CAMERA BUTTON TO SNAP";
                cameraInput.value = "";
            }, 2000);
        };
    });
</script>

</body>
</html>
