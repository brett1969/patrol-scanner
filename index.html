<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>National Towing - Patrol Marker</title>
    
    <!-- iOS PWA Directives -->
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Patrol Scan">
    
    <link rel="apple-touch-icon" href="apple-touch-icon.png?v=160">
    <link rel="apple-touch-icon-precomposed" href="apple-touch-icon.png?v=160">
    <link rel="icon" type="image/png" href="apple-touch-icon.png?v=160">

    <!-- Fast Client-Side OCR Engine -->
    <script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script>

    <style>
        body { 
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; 
            margin: 0; 
            padding: 16px; 
            background: #121212; 
            color: #fff; 
            -webkit-user-select: none;
        }
        .card { 
            background: #1e1e1e; 
            border-radius: 14px; 
            padding: 20px; 
            box-shadow: 0 4px 15px rgba(0,0,0,0.6); 
            border: 1px solid #2a2a2a;
        }
        h2 { 
            margin-top: 0; 
            color: #00e676; 
            text-align: center; 
            font-size: 20px;
            letter-spacing: 1px;
            margin-bottom: 6px;
        }
        label { 
            font-size: 11px; 
            text-transform: uppercase; 
            color: #888; 
            display: block; 
            margin-top: 14px; 
            font-weight: 600;
        }
        input, button { 
            width: 100%; 
            padding: 14px; 
            border-radius: 10px; 
            border: 1px solid #333; 
            background: #2a2a2a; 
            color: #fff; 
            font-size: 16px; 
            box-sizing: border-box; 
            margin-top: 6px; 
            outline: none;
        }
        input:focus { border-color: #00e676; }
        button.primary { 
            background: #00e676; 
            color: #000; 
            font-weight: bold; 
            border: none; 
            margin-top: 20px; 
            cursor: pointer; 
            font-size: 20px;
            padding: 18px;
            box-shadow: 0 4px 10px rgba(0, 230, 118, 0.3);
        }
        button.primary:active { transform: scale(0.98); }
        #preview { 
            width: 100%; 
            max-height: 220px; 
            object-fit: cover; 
            border-radius: 10px; 
            display: none; 
            margin-top: 12px; 
            border: 2px solid #00e676;
        }
        #status { 
            text-align: center; 
            font-size: 13px; 
            color: #ffab00; 
            margin-top: 10px; 
            font-weight: 600;
        }
        .gps-badge {
            font-size: 12px;
            color: #00e676;
            text-align: center;
            margin-bottom: 10px;
            font-weight: 500;
        }
    </style>
</head>
<body>

<div class="card">
    <h2>NIGHT PATROL MARKER</h2>
    <div id="gpsStatus" class="gps-badge">Locating Property via GPS...</div>
    
    <label>Location / Property</label>
    <input type="text" id="propertyName" placeholder="Detecting location..." style="font-weight: 600; color: #00e676;">

    <label>Capture Vehicle Photo</label>
    <input type="file" id="cameraInput" accept="image/*" capture="environment">
    <img id="preview" alt="Vehicle Preview">

    <div id="status"></div>

    <label>Vehicle Registration (ANPR)</label>
    <input type="text" id="rego" placeholder="e.g. 719LL3" style="text-transform: uppercase; font-weight: bold; font-size: 26px; text-align: center; color: #00e676; letter-spacing: 2px;">

    <button class="primary" id="submitBtn">MARK PATROL ENTRY</button>
</div>

<canvas id="procCanvas" style="display:none;"></canvas>
<canvas id="cropCanvas" style="display:none;"></canvas>
<iframe name="hiddenTarget" id="hiddenTarget" style="display:none;"></iframe>
<form id="bypassForm" action="https://script.google.com/macros/s/AKfycbzoWD84FAwprSdWAZlm4YeyjU9ps3kTW_XXN_QMkTJxvm-LMrnFIZ2RzDLDShbV5ATK8g/exec" method="POST" target="hiddenTarget" style="display:none;">
    <input type="hidden" name="payload" id="formPayload">
</form>

<script>
    const GOOGLE_SCRIPT_URL = "https://script.google.com/macros/s/AKfycbzoWD84FAwprSdWAZlm4YeyjU9ps3kTW_XXN_QMkTJxvm-LMrnFIZ2RzDLDShbV5ATK8g/exec";
    let base64Image = "";
    let propertyDatabase = [];

    const cameraInput = document.getElementById('cameraInput');
    const preview = document.getElementById('preview');
    const status = document.getElementById('status');
    const gpsStatus = document.getElementById('gpsStatus');
    const regoInput = document.getElementById('rego');
    const propertyInput = document.getElementById('propertyName');
    const canvas = document.getElementById('procCanvas');
    const cropCanvas = document.getElementById('cropCanvas');
    const ctx = canvas.getContext('2d');
    const cropCtx = cropCanvas.getContext('2d');
    const bypassForm = document.getElementById('bypassForm');
    const formPayload = document.getElementById('formPayload');

    // AUTO-MATCH PROPERTY VIA GEOLOCATION
    window.addEventListener('load', async () => {
        try {
            const res = await fetch(`${GOOGLE_SCRIPT_URL}?action=get_properties`);
            propertyDatabase = await res.json();

            if (navigator.geolocation) {
                navigator.geolocation.getCurrentPosition(position => {
                    const userLat = position.coords.latitude;
                    const userLng = position.coords.longitude;
                    
                    let matchedProp = propertyDatabase.find(p => {
                        if (!p.lat || !p.lng) return false;
                        const dist = getDistanceMeters(userLat, userLng, p.lat, p.lng);
                        return dist <= p.radius;
                    });

                    if (matchedProp) {
                        propertyInput.value = matchedProp.name;
                        gpsStatus.innerText = `GPS Locked: ${matchedProp.name}`;
                    } else {
                        propertyInput.placeholder = "Enter Property Name...";
                        gpsStatus.innerText = "GPS Active: Enter location manually if needed";
                    }
                }, () => {
                    propertyInput.placeholder = "Enter Property Name...";
                    gpsStatus.innerText = "GPS Disabled: Enter location manually";
                });
            }
        } catch(e) {
            propertyInput.placeholder = "Enter Property Name...";
            gpsStatus.innerText = "Location Offline: Manual Mode";
        }
    });

    function getDistanceMeters(lat1, lon1, lat2, lon2) {
        const R = 6371e3;
        const dLat = (lat2 - lat1) * Math.PI / 180;
        const dLon = (lon2 - lon1) * Math.PI / 180;
        const a = Math.sin(dLat/2) * Math.sin(dLat/2) +
                  Math.cos(lat1 * Math.PI / 180) * Math.cos(lat2 * Math.PI / 180) *
                  Math.sin(dLon/2) * Math.sin(dLon/2);
        return R * 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a));
    }

    // PHOTO CAPTURE & FAST ANPR
    cameraInput.addEventListener('change', async (e) => {
        const file = e.target.files[0];
        if (!file) return;

        status.innerText = "Reading Rego...";

        const img = new Image();
        img.src = URL.createObjectURL(file);

        img.onload = async () => {
            preview.src = img.src;
            preview.style.display = "block";

            const maxWidth = 800;
            const scale = maxWidth / img.width;
            canvas.width = (img.width > maxWidth) ? maxWidth : img.width;
            canvas.height = (img.width > maxWidth) ? img.height * scale : img.height;

            ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
            base64Image = canvas.toDataURL('image/jpeg', 0.75).split(',')[1];

            // Crop plate region
            const cropX = canvas.width * 0.10;
            const cropY = canvas.height * 0.35;
            const cropW = canvas.width * 0.80;
            const cropH = canvas.height * 0.60;

            cropCanvas.width = cropW;
            cropCanvas.height = cropH;
            cropCtx.drawImage(canvas, cropX, cropY, cropW, cropH, 0, 0, cropW, cropH);

            try {
                const worker = await Tesseract.createWorker('eng');
                await worker.setParameters({ tessedit_char_whitelist: 'ABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789' });
                const { data: { text } } = await worker.recognize(cropCanvas);
                await worker.terminate();

                const matches = text.toUpperCase().match(/[A-Z0-9]{3,7}/g);
                if (matches) {
                    const filtered = matches.filter(m => !["QUEENSLAND", "SUNSHINE", "STATE"].includes(m));
                    const best = filtered.find(m => /[A-Z]/.test(m) && /[0-9]/.test(m)) || filtered[0];
                    if (best) regoInput.value = best;
                }
                status.innerText = "Tap MARK to submit";
            } catch (err) {
                status.innerText = "Verify rego and tap MARK";
            }
        };
    });

    // SUBMIT & INSTANT RESET
    document.getElementById('submitBtn').addEventListener('click', () => {
        const regoVal = regoInput.value.trim().toUpperCase();
        if (!regoVal) {
            alert("Please scan or enter a registration.");
            return;
        }

        status.innerText = "Logging Entry...";

        const payloadObj = {
            "action": "patrol_upload",
            "propertyName": propertyInput.value || "GENERAL",
            "rego": regoVal,
            "imageBytes": base64Image
        };

        formPayload.value = JSON.stringify(payloadObj);
        bypassForm.submit();

        status.innerText = "LOGGED!";
        
        setTimeout(() => {
            regoInput.value = "";
            preview.style.display = "none";
            cameraInput.value = "";
            status.innerText = "";
        }, 800);
    });
</script>

</body>
</html>
