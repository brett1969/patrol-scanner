<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>MARK CAR</title>
    
    <!-- PWA Directives -->
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Mark Car">
    
    <link rel="apple-touch-icon" href="apple-touch-icon.png?v=460">
    <link rel="icon" type="image/png" href="apple-touch-icon.png?v=460">

    <style>
        * { box-sizing: border-box; }
        body { 
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; 
            margin: 0; 
            padding: 12px; 
            background: #121212; 
            color: #fff; 
            -webkit-user-select: none;
            display: flex;
            flex-direction: column;
            height: 100vh;
        }
        .header {
            text-align: center;
            margin-bottom: 8px;
        }
        .header h1 {
            margin: 0;
            font-size: 24px;
            font-weight: 900;
            color: #888;
            letter-spacing: 2px;
        }
        .location-banner {
            background: #1e1e1e;
            border-radius: 12px;
            padding: 10px;
            border: 1px solid #333;
            text-align: center;
            margin-bottom: 10px;
        }
        .location-title {
            font-size: 10px;
            color: #888;
            text-transform: uppercase;
            font-weight: 700;
        }
        .location-name {
            font-size: 22px;
            font-weight: 800;
            color: #00e676;
            margin-top: 2px;
        }
        .view-container {
            flex: 1;
            position: relative;
            background: #000;
            border-radius: 16px;
            overflow: hidden;
            border: 2px solid #2a2a2a;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        video {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }
        .overlay-rego {
            position: absolute;
            top: 12px;
            left: 12px;
            right: 12px;
            background: rgba(0,0,0,0.85);
            border: 2px solid #00e676;
            border-radius: 12px;
            padding: 10px;
            text-align: center;
        }
        .rego-display {
            font-size: 32px;
            font-weight: 900;
            color: #00e676;
            letter-spacing: 3px;
        }
        .status-display {
            font-size: 13px;
            font-weight: 700;
            color: #fff;
            margin-top: 2px;
        }
        .controls {
            padding: 12px 0 6px 0;
            display: flex;
            justify-content: center;
        }
        .snap-btn {
            background: #00e676;
            color: #000;
            border: none;
            width: 84px;
            height: 84px;
            border-radius: 50%;
            font-size: 38px;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 6px 20px rgba(0, 230, 118, 0.5);
            cursor: pointer;
            transition: transform 0.1s ease;
        }
        .snap-btn:active {
            transform: scale(0.90);
        }
    </style>
</head>
<body>

<div class="header">
    <h1>MARK CAR</h1>
</div>

<div class="location-banner">
    <div class="location-title" id="gpsStatus">GPS LOCKING...</div>
    <div class="location-name" id="propertyName">LOCATING...</div>
</div>

<div class="view-container">
    <video id="webcam" autoplay playsinline muted></video>
    
    <div class="overlay-rego">
        <div class="rego-display" id="rego">READY</div>
        <div class="status-display" id="status">TAP BUTTON TO SNAP</div>
    </div>
</div>

<div class="controls">
    <button class="snap-btn" id="snapBtn">📷</button>
</div>

<canvas id="procCanvas" style="display:none;"></canvas>
<iframe name="hiddenTarget" id="hiddenTarget" style="display:none;"></iframe>
<form id="bypassForm" action="https://script.google.com/macros/s/AKfycbzoWD84FAwprSdWAZlm4YeyjU9ps3kTW_XXN_QMkTJxvm-LMrnFIZ2RzDLDShbV5ATK8g/exec" method="POST" target="hiddenTarget" style="display:none;">
    <input type="hidden" name="payload" id="formPayload">
</form>

<script>
    const GOOGLE_SCRIPT_URL = "https://script.google.com/macros/s/AKfycbzoWD84FAwprSdWAZlm4YeyjU9ps3kTW_XXN_QMkTJxvm-LMrnFIZ2RzDLDShbV5ATK8g/exec";
    const PLATE_RECOGNIZER_KEY = "74a8bb83a49461eef0266274ce63e1e198b4c888";
    
    let propertyDatabase = [];
    let activeStream = null;

    const video = document.getElementById('webcam');
    const snapBtn = document.getElementById('snapBtn');
    const status = document.getElementById('status');
    const gpsStatus = document.getElementById('gpsStatus');
    const regoDisplay = document.getElementById('rego');
    const propertyNameDisplay = document.getElementById('propertyName');
    const canvas = document.getElementById('procCanvas');
    const ctx = canvas.getContext('2d');
    const bypassForm = document.getElementById('bypassForm');
    const formPayload = document.getElementById('formPayload');

    // 1. START LIVE CAMERA & GPS
    window.addEventListener('load', async () => {
        startCamera();
        
        try {
            const res = await fetch(`${GOOGLE_SCRIPT_URL}?action=get_properties`);
            propertyDatabase = await res.json();

            if (navigator.geolocation) {
                navigator.geolocation.getCurrentPosition(position => {
                    const userLat = position.coords.latitude;
                    const userLng = position.coords.longitude;
                    
                    let matchedProp = propertyDatabase.find(p => {
                        if (!p.lat || !p.lng) return false;
                        return getDistanceMeters(userLat, userLng, p.lat, p.lng) <= p.radius;
                    });

                    if (matchedProp) {
                        propertyNameDisplay.innerText = matchedProp.name.toUpperCase();
                        gpsStatus.innerText = "GPS LOCKED";
                    } else {
                        propertyNameDisplay.innerText = "GENERAL PATROL";
                        gpsStatus.innerText = "LOCATION ACTIVE";
                    }
                });
            }
        } catch(e) {
            propertyNameDisplay.innerText = "GENERAL PATROL";
            gpsStatus.innerText = "LOCATION OFFLINE";
        }
    });

    async function startCamera() {
        try {
            activeStream = await navigator.mediaDevices.getUserMedia({
                video: { facingMode: { exact: "environment" }, width: { ideal: 1920 }, height: { ideal: 1080 } },
                audio: false
            });
            video.srcObject = activeStream;
        } catch (err) {
            try {
                activeStream = await navigator.mediaDevices.getUserMedia({
                    video: { facingMode: "user" },
                    audio: false
                });
                video.srcObject = activeStream;
            } catch(e) {
                status.innerText = "CAMERA ACCESS DENIED";
            }
        }
    }

    function getDistanceMeters(lat1, lon1, lat2, lon2) {
        const R = 6371e3;
        const dLat = (lat2 - lat1) * Math.PI / 180;
        const dLon = (lon2 - lon1) * Math.PI / 180;
        const a = Math.sin(dLat/2) * Math.sin(dLat/2) +
                  Math.cos(lat1 * Math.PI / 180) * Math.cos(lat2 * Math.PI / 180) *
                  Math.sin(dLon/2) * Math.sin(dLon/2);
        return R * 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a));
    }

    // 2. INSTANT CAPTURE ON BUTTON TAP
    snapBtn.addEventListener('click', async () => {
        if (!video.videoWidth) return;

        status.innerText = "⚡ READING PLATE...";
        regoDisplay.innerText = "READING...";

        // Capture frame from video stream onto canvas
        canvas.width = 800;
        const scale = 800 / video.videoWidth;
        canvas.height = video.videoHeight * scale;
        ctx.drawImage(video, 0, 0, canvas.width, canvas.height);

        const compressedBase64 = canvas.toDataURL('image/jpeg', 0.65).split(',')[1];

        let detectedRego = "UNREADABLE";
        let confidence = "LOW";
        let makeModel = "GENERAL";

        // Direct high-speed API call
        try {
            const startTime = performance.now();
            
            // Convert Canvas base64 to Blob
            const byteCharacters = atob(compressedBase64);
            const byteNumbers = new Array(byteCharacters.length);
            for (let i = 0; i < byteCharacters.length; i++) {
                byteNumbers[i] = byteCharacters.charCodeAt(i);
            }
            const byteArray = new Uint8Array(byteNumbers);
            const blob = new Blob([byteArray], {type: 'image/jpeg'});

            let formData = new FormData();
            formData.append('upload', blob, 'snap.jpg');
            formData.append('regions', 'au');

            const anprRes = await fetch('https://api.platerecognizer.com/v1/plate-reader/', {
                method: 'POST',
                headers: { 'Authorization': `Token ${PLATE_RECOGNIZER_KEY}` },
                body: formData
            });

            const anprData = await anprRes.json();
            const elapsedSeconds = ((performance.now() - startTime) / 1000).toFixed(1);

            if (anprData.results && anprData.results.length > 0) {
                const topResult = anprData.results[0];
                detectedRego = topResult.plate.toUpperCase();
                confidence = (topResult.score > 0.8) ? "HIGH" : "LOW";

                if (topResult.vehicle && topResult.vehicle.make) {
                    makeModel = `${topResult.vehicle.make} ${topResult.vehicle.model || ''}`.trim().toUpperCase();
                }
            }

            regoDisplay.innerText = detectedRego;
            status.innerText = `✔ MARKED (${elapsedSeconds}s)`;

        } catch(err) {
            regoDisplay.innerText = "UNREADABLE";
            status.innerText = "MARKED (CHECK PLATE)";
        }

        // Background logging
        const payloadObj = {
            "action": "patrol_upload",
            "propertyName": propertyNameDisplay.innerText || "GENERAL PATROL",
            "rego": detectedRego,
            "confidence": confidence,
            "makeModel": makeModel,
            "imageBytes": compressedBase64
        };

        formPayload.value = JSON.stringify(payloadObj);
        bypassForm.submit();

        setTimeout(() => {
            status.innerText = "TAP BUTTON TO SNAP";
        }, 2000);
    });
</script>

</body>
</html>
