<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>National Towing - Patrol Marker</title>
    
    <!-- PWA Directives -->
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Patrol Scan">
    
    <link rel="apple-touch-icon" href="apple-touch-icon.png?v=400">
    <link rel="icon" type="image/png" href="apple-touch-icon.png?v=400">

    <!-- High-Speed Client OCR Engine -->
    <script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script>

    <style>
        body { 
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; 
            margin: 0; 
            padding: 16px; 
            background: #121212; 
            color: #fff; 
            -webkit-user-select: none;
        }
        .card { 
            background: #1e1e1e; 
            border-radius: 16px; 
            padding: 20px; 
            box-shadow: 0 4px 15px rgba(0,0,0,0.6); 
            border: 1px solid #2a2a2a;
            text-align: center;
        }
        h2 { 
            margin-top: 0; 
            color: #00e676; 
            font-size: 20px;
            letter-spacing: 1px;
            margin-bottom: 4px;
        }
        label { 
            font-size: 11px; 
            text-transform: uppercase; 
            color: #888; 
            display: block; 
            margin-top: 14px; 
            font-weight: 600;
            text-align: left;
        }
        input { 
            width: 100%; 
            padding: 14px; 
            border-radius: 10px; 
            border: 1px solid #333; 
            background: #2a2a2a; 
            color: #fff; 
            font-size: 16px; 
            box-sizing: border-box; 
            margin-top: 6px; 
            outline: none;
        }
        .camera-btn-wrapper {
            position: relative;
            margin-top: 20px;
            margin-bottom: 10px;
        }
        .camera-btn {
            background: #00e676;
            color: #000;
            font-weight: 800;
            border: none;
            border-radius: 14px;
            padding: 24px;
            font-size: 22px;
            width: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
            box-shadow: 0 6px 16px rgba(0, 230, 118, 0.4);
            cursor: pointer;
        }
        .camera-btn:active { transform: scale(0.97); }
        .camera-input {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            opacity: 0;
            cursor: pointer;
        }
        #status { 
            font-size: 20px; 
            font-weight: 800;
            color: #00e676; 
            margin-top: 15px; 
            min-height: 28px;
        }
        .gps-badge {
            font-size: 12px;
            color: #888;
            margin-bottom: 12px;
        }
    </style>
</head>
<body>

<div class="card">
    <h2>NIGHT PATROL MARKER</h2>
    <div id="gpsStatus" class="gps-badge">Locating Property via GPS...</div>
    
    <label>Location / Property</label>
    <input type="text" id="propertyName" placeholder="Detecting location..." style="font-weight: 600; color: #00e676;">

    <div class="camera-btn-wrapper">
        <button class="camera-btn">
            📷 SNAP & MARK PATROL
        </button>
        <input type="file" id="cameraInput" class="camera-input" accept="image/*" capture="environment">
    </div>

    <div id="status"></div>

    <label>Scanned Plate Result</label>
    <input type="text" id="rego" placeholder="READY FOR SNAP" style="text-transform: uppercase; font-weight: bold; font-size: 32px; text-align: center; color: #00e676; letter-spacing: 2px;" readonly>
</div>

<canvas id="procCanvas" style="display:none;"></canvas>
<iframe name="hiddenTarget" id="hiddenTarget" style="display:none;"></iframe>
<form id="bypassForm" action="https://script.google.com/macros/s/AKfycbzoWD84FAwprSdWAZlm4YeyjU9ps3kTW_XXN_QMkTJxvm-LMrnFIZ2RzDLDShbV5ATK8g/exec" method="POST" target="hiddenTarget" style="display:none;">
    <input type="hidden" name="payload" id="formPayload">
</form>

<script>
    const GOOGLE_SCRIPT_URL = "https://script.google.com/macros/s/AKfycbzoWD84FAwprSdWAZlm4YeyjU9ps3kTW_XXN_QMkTJxvm-LMrnFIZ2RzDLDShbV5ATK8g/exec";
    let propertyDatabase = [];
    let ocrWorker = null;

    const cameraInput = document.getElementById('cameraInput');
    const status = document.getElementById('status');
    const gpsStatus = document.getElementById('gpsStatus');
    const regoInput = document.getElementById('rego');
    const propertyInput = document.getElementById('propertyName');
    const canvas = document.getElementById('procCanvas');
    const ctx = canvas.getContext('2d');
    const bypassForm = document.getElementById('bypassForm');
    const formPayload = document.getElementById('formPayload');

    // 1. INITIALIZE ENGINE & GPS
    window.addEventListener('load', async () => {
        status.innerText = "Initializing Engine...";
        try {
            ocrWorker = await Tesseract.createWorker('eng');
            await ocrWorker.setParameters({
                tessedit_char_whitelist: 'ABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789'
            });
            status.innerText = "";
        } catch(e) {
            status.innerText = "";
        }

        try {
            const res = await fetch(`${GOOGLE_SCRIPT_URL}?action=get_properties`);
            propertyDatabase = await res.json();

            if (navigator.geolocation) {
                navigator.geolocation.getCurrentPosition(position => {
                    const userLat = position.coords.latitude;
                    const userLng = position.coords.longitude;
                    
                    let matchedProp = propertyDatabase.find(p => {
                        if (!p.lat || !p.lng) return false;
                        return getDistanceMeters(userLat, userLng, p.lat, p.lng) <= p.radius;
                    });

                    if (matchedProp) {
                        propertyInput.value = matchedProp.name;
                        gpsStatus.innerText = `GPS Locked: ${matchedProp.name}`;
                    } else {
                        propertyInput.placeholder = "Enter Property Name...";
                        gpsStatus.innerText = "GPS Active: Enter location manually";
                    }
                });
            }
        } catch(e) {
            propertyInput.placeholder = "Enter Property Name...";
            gpsStatus.innerText = "Location Offline";
        }
    });

    function getDistanceMeters(lat1, lon1, lat2, lon2) {
        const R = 6371e3;
        const dLat = (lat2 - lat1) * Math.PI / 180;
        const dLon = (lon2 - lon1) * Math.PI / 180;
        const a = Math.sin(dLat/2) * Math.sin(dLat/2) +
                  Math.cos(lat1 * Math.PI / 180) * Math.cos(lat2 * Math.PI / 180) *
                  Math.sin(dLon/2) * Math.sin(dLon/2);
        return R * 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a));
    }

    // 2. ON-DEVICE RECOGNITION
    cameraInput.addEventListener('change', async (e) => {
        const file = e.target.files[0];
        if (!file) return;

        status.innerText = "⚡ READING PLATE...";
        regoInput.value = "READING...";

        const img = new Image();
        img.src = URL.createObjectURL(file);

        img.onload = async () => {
            const width = img.width;
            const height = img.height;
            const cropX = width * 0.15;
            const cropY = height * 0.40;
            const cropW = width * 0.70;
            const cropH = height * 0.50;

            canvas.width = 600;
            canvas.height = 300;
            ctx.drawImage(img, cropX, cropY, cropW, cropH, 0, 0, 600, 300);

            const imgData = ctx.getImageData(0, 0, 600, 300);
            const d = imgData.data;
            for (let i = 0; i < d.length; i += 4) {
                let v = (0.2126 * d[i] + 0.7152 * d[i+1] + 0.0722 * d[i+2] >= 120) ? 255 : 0;
                d[i] = d[i+1] = d[i+2] = v;
            }
            ctx.putImageData(imgData, 0, 0);

            let detectedRego = "UNREADABLE";
            let confidence = "LOW";

            if (ocrWorker) {
                const ret = await ocrWorker.recognize(canvas);
                const lines = ret.data.text.split('\n');
                
                for (let line of lines) {
                    let clean = line.replace(/[^A-Z0-9]/g, '').toUpperCase();
                    if (clean.startsWith('E') && clean.length >= 6) {
                        clean = '3' + clean.substring(1);
                    }
                    if (clean.length >= 3 && clean.length <= 7 && !clean.includes("QUEENSLAND")) {
                        detectedRego = clean;
                        confidence = "HIGH";
                        break;
                    }
                }
            }

            regoInput.value = detectedRego;
            status.innerText = "✔ MARKED!";

            const fullCanvas = document.createElement('canvas');
            const scale = 800 / img.width;
            fullCanvas.width = 800;
            fullCanvas.height = img.height * scale;
            fullCanvas.getContext('2d').drawImage(img, 0, 0, fullCanvas.width, fullCanvas.height);
            const base64Image = fullCanvas.toDataURL('image/jpeg', 0.75).split(',')[1];

            const payloadObj = {
                "action": "patrol_upload",
                "propertyName": propertyInput.value || "GENERAL",
                "rego": detectedRego,
                "confidence": confidence,
                "imageBytes": base64Image
            };

            formPayload.value = JSON.stringify(payloadObj);
            bypassForm.submit();

            setTimeout(() => {
                status.innerText = "";
                cameraInput.value = "";
            }, 1500);
        };
    });
</script>

</body>
</html>
