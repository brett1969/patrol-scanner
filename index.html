<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>National Towing - Patrol Scanner</title>
    
    <!-- iOS PWA Mobile Settings -->
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Patrol Scan">
    
    <!-- Native iOS Camera Icon (High-Res 180x180 Embedded Base64 PNG) -->
    <link rel="apple-touch-icon" href="data:image/png;base64,iVBORw0KGgoAAAANSU5ErkJggg==">
    <link rel="apple-touch-icon" sizes="180x180" href="data:image/png;base64,iVBORw0KGgoAAAANSU5ErkJggg==">
    <link rel="icon" type="image/png" href="data:image/png;base64,iVBORw0KGgoAAAANSU5ErkJggg==">

    <!-- Embedded Web App Manifest for iOS/Android PWA Installation -->
    <link rel="manifest" href='data:application/json,{"name":"Patrol Scanner","short_name":"Patrol","start_url":".","display":"standalone","background_color":"#121212","theme_color":"#00e676","icons":[{"src":"data:image/png;base64,iVBORw0KGgoAAAANSU5ErkJggg==","sizes":"180x180","type":"image/png"}]}'>

    <!-- Client-Side OCR Engine for ANPR -->
    <script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script>

    <style>
        body { 
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; 
            margin: 0; 
            padding: 16px; 
            background: #121212; 
            color: #fff; 
            -webkit-user-select: none;
        }
        .card { 
            background: #1e1e1e; 
            border-radius: 14px; 
            padding: 20px; 
            margin-bottom: 16px; 
            box-shadow: 0 4px 15px rgba(0,0,0,0.6); 
            border: 1px solid #2a2a2a;
        }
        h2 { 
            margin-top: 0; 
            color: #00e676; 
            text-align: center; 
            font-size: 20px;
            letter-spacing: 1px;
        }
        label { 
            font-size: 11px; 
            text-transform: uppercase; 
            color: #888; 
            display: block; 
            margin-top: 12px; 
            font-weight: 600;
        }
        input, select, button { 
            width: 100%; 
            padding: 14px; 
            border-radius: 10px; 
            border: 1px solid #333; 
            background: #2a2a2a; 
            color: #fff; 
            font-size: 16px; 
            box-sizing: border-box; 
            margin-top: 5px; 
            outline: none;
        }
        input:focus, select:focus {
            border-color: #00e676;
        }
        button.primary { 
            background: #00e676; 
            color: #000; 
            font-weight: bold; 
            border: none; 
            margin-top: 20px; 
            cursor: pointer; 
            font-size: 18px;
            box-shadow: 0 4px 10px rgba(0, 230, 118, 0.3);
        }
        button.primary:active {
            transform: scale(0.98);
        }
        #preview { 
            width: 100%; 
            max-height: 250px; 
            object-fit: cover; 
            border-radius: 10px; 
            display: none; 
            margin-top: 12px; 
            border: 2px solid #00e676;
        }
        #status { 
            text-align: center; 
            font-size: 13px; 
            color: #ffab00; 
            margin-top: 12px; 
            font-weight: 500;
        }
    </style>
</head>
<body>

<div class="card">
    <h2>NIGHT PATROL SCANNER</h2>
    
    <label>Select Property / Location</label>
    <select id="propertyName">
        <option value="GENERAL">Select Property...</option>
        <option value="Southport Central">Southport Central</option>
        <option value="View Apartments">View Apartments</option>
        <option value="The Cape">The Cape</option>
        <option value="The Summit">The Summit</option>
        <option value="Waterpoint">Waterpoint</option>
        <option value="East Quays">East Quays</option>
        <option value="Zephyr">Zephyr</option>
        <option value="The Reserve">The Reserve</option>
        <option value="South Lakes">South Lakes</option>
        <option value="Aura">Aura</option>
        <option value="The Retreat">The Retreat</option>
        <option value="Magnoli">Magnoli</option>
        <option value="The Tally">The Tally</option>
    </select>

    <label>Capture Vehicle Photo</label>
    <input type="file" id="cameraInput" accept="image/*" capture="environment">
    <img id="preview" alt="Vehicle Preview">

    <div id="status"></div>

    <label>Vehicle Registration (ANPR)</label>
    <input type="text" id="rego" placeholder="e.g. ABC123" style="text-transform: uppercase; font-weight: bold; font-size: 22px; text-align: center; color: #00e676; letter-spacing: 2px;">

    <div style="display: flex; gap: 8px;">
        <div style="flex: 1;">
            <label>Make</label>
            <input type="text" id="make" placeholder="Toyota">
        </div>
        <div style="flex: 1;">
            <label>Model</label>
            <input type="text" id="model" placeholder="Corolla">
        </div>
    </div>

    <div style="display: flex; gap: 8px;">
        <div style="flex: 1;">
            <label>Colour</label>
            <input type="text" id="colour" placeholder="White">
        </div>
        <div style="flex: 1;">
            <label>Body Type</label>
            <select id="bodyType">
                <option value="Sedan">Sedan</option>
                <option value="Hatchback">Hatchback</option>
                <option value="SUV">SUV</option>
                <option value="Ute">Ute</option>
                <option value="Coupe">Coupe</option>
                <option value="Van">Van</option>
            </select>
        </div>
    </div>

    <button class="primary" id="submitBtn">LOG VEHICLE PATROL</button>
</div>

<script>
    const GOOGLE_SCRIPT_URL = "https://script.google.com/macros/s/AKfycbzewwYSIC5iOe58uUCurMIkgfHbl6vsE_g5dcRtmg8NViZ5m7fFKHEj7JL2JDmPi08aSQ/exec";
    let base64Image = "";

    const cameraInput = document.getElementById('cameraInput');
    const preview = document.getElementById('preview');
    const status = document.getElementById('status');
    const regoInput = document.getElementById('rego');

    // Handle Camera Capture & Client-side ANPR Extraction
    cameraInput.addEventListener('change', async (e) => {
        const file = e.target.files[0];
        if (!file) return;

        preview.src = URL.createObjectURL(file);
        preview.style.display = "block";
        status.innerText = "Extracting Registration (ANPR)...";

        const reader = new FileReader();
        reader.onloadend = async () => {
            base64Image = reader.result.split(',')[1];

            try {
                const { data: { text } } = await Tesseract.recognize(file, 'eng');
                const cleanRego = text.replace(/[^A-Za-z0-9]/g, '').toUpperCase().slice(0, 7);
                if (cleanRego.length >= 2) {
                    regoInput.value = cleanRego;
                    status.innerText = "Registration Extracted Successfully!";
                } else {
                    status.innerText = "Could not detect rego clearly. Type manually.";
                }
            } catch (err) {
                status.innerText = "ANPR processing error. Enter rego manually.";
            }
        };
        reader.readAsDataURL(file);
    });

    // Handle Patrol Log Submission
    document.getElementById('submitBtn').addEventListener('click', async () => {
        const regoVal = regoInput.value.trim().toUpperCase();
        if (!regoVal) {
            alert("Please enter or scan a vehicle registration.");
            return;
        }

        status.innerText = "Uploading patrol entry to Master Log...";

        const payload = {
            "action": "patrol_upload",
            "propertyName": document.getElementById('propertyName').value,
            "rego": regoVal,
            "make": document.getElementById('make').value,
            "model": document.getElementById('model').value,
            "colour": document.getElementById('colour').value,
            "bodyType": document.getElementById('bodyType').value,
            "imageBytes": base64Image,
            "timestamp": new Date().toISOString()
        };

        try {
            await fetch(GOOGLE_SCRIPT_URL, {
                method: "POST",
                mode: "no-cors",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify(payload)
            });

            status.innerText = "Vehicle Logged Successfully!";
            
            // Reset form for next vehicle
            setTimeout(() => {
                regoInput.value = "";
                document.getElementById('make').value = "";
                document.getElementById('model').value = "";
                document.getElementById('colour').value = "";
                preview.style.display = "none";
                cameraInput.value = "";
                status.innerText = "";
            }, 1800);

        } catch (err) {
            status.innerText = "Upload failed. Check connection.";
            console.error(err);
        }
    });
</script>

</body>
</html>
