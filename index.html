<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>National Towing - Patrol Scanner</title>
    
    <!-- iOS PWA Directives -->
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Patrol Scan">
    
    <!-- Native iOS & Favicon Icon Links -->
    <link rel="apple-touch-icon" href="apple-touch-icon.png?v=100">
    <link rel="apple-touch-icon-precomposed" href="apple-touch-icon.png?v=100">
    <link rel="icon" type="image/png" href="apple-touch-icon.png?v=100">

    <style>
        body { 
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; 
            margin: 0; 
            padding: 16px; 
            background: #121212; 
            color: #fff; 
            -webkit-user-select: none;
        }
        .card { 
            background: #1e1e1e; 
            border-radius: 14px; 
            padding: 20px; 
            margin-bottom: 16px; 
            box-shadow: 0 4px 15px rgba(0,0,0,0.6); 
            border: 1px solid #2a2a2a;
        }
        h2 { 
            margin-top: 0; 
            color: #00e676; 
            text-align: center; 
            font-size: 20px;
            letter-spacing: 1px;
        }
        label { 
            font-size: 11px; 
            text-transform: uppercase; 
            color: #888; 
            display: block; 
            margin-top: 12px; 
            font-weight: 600;
        }
        input, select, button { 
            width: 100%; 
            padding: 14px; 
            border-radius: 10px; 
            border: 1px solid #333; 
            background: #2a2a2a; 
            color: #fff; 
            font-size: 16px; 
            box-sizing: border-box; 
            margin-top: 5px; 
            outline: none;
        }
        input:focus, select:focus {
            border-color: #00e676;
        }
        button.primary { 
            background: #00e676; 
            color: #000; 
            font-weight: bold; 
            border: none; 
            margin-top: 20px; 
            cursor: pointer; 
            font-size: 18px;
            box-shadow: 0 4px 10px rgba(0, 230, 118, 0.3);
        }
        button.primary:active {
            transform: scale(0.98);
        }
        #preview { 
            width: 100%; 
            max-height: 250px; 
            object-fit: cover; 
            border-radius: 10px; 
            display: none; 
            margin-top: 12px; 
            border: 2px solid #00e676;
        }
        #status { 
            text-align: center; 
            font-size: 13px; 
            color: #ffab00; 
            margin-top: 12px; 
            font-weight: 500;
        }
    </style>
</head>
<body>

<div class="card">
    <h2>NIGHT PATROL SCANNER</h2>
    
    <label>Select Property / Location</label>
    <select id="propertyName">
        <option value="GENERAL">Select Property...</option>
        <option value="Southport Central">Southport Central</option>
        <option value="View Apartments">View Apartments</option>
        <option value="The Cape">The Cape</option>
        <option value="The Summit">The Summit</option>
        <option value="Waterpoint">Waterpoint</option>
        <option value="East Quays">East Quays</option>
        <option value="Zephyr">Zephyr</option>
        <option value="The Reserve">The Reserve</option>
        <option value="South Lakes">South Lakes</option>
        <option value="Aura">Aura</option>
        <option value="The Retreat">The Retreat</option>
        <option value="Magnoli">Magnoli</option>
        <option value="The Tally">The Tally</option>
    </select>

    <label>Capture Vehicle Photo</label>
    <input type="file" id="cameraInput" accept="image/*" capture="environment">
    <img id="preview" alt="Vehicle Preview">

    <div id="status"></div>

    <label>Vehicle Registration (ANPR)</label>
    <input type="text" id="rego" placeholder="e.g. 028LD8" style="text-transform: uppercase; font-weight: bold; font-size: 22px; text-align: center; color: #00e676; letter-spacing: 2px;">

    <div style="display: flex; gap: 8px;">
        <div style="flex: 1;">
            <label>Make</label>
            <input type="text" id="make" placeholder="Toyota">
        </div>
        <div style="flex: 1;">
            <label>Model</label>
            <input type="text" id="model" placeholder="Camry">
        </div>
    </div>

    <div style="display: flex; gap: 8px;">
        <div style="flex: 1;">
            <label>Colour</label>
            <input type="text" id="colour" placeholder="White">
        </div>
        <div style="flex: 1;">
            <label>Body Type</label>
            <select id="bodyType">
                <option value="Sedan">Sedan</option>
                <option value="Hatchback">Hatchback</option>
                <option value="SUV">SUV</option>
                <option value="Ute">Ute</option>
                <option value="Coupe">Coupe</option>
                <option value="Van">Van</option>
            </select>
        </div>
    </div>

    <button class="primary" id="submitBtn">LOG VEHICLE PATROL</button>
</div>

<canvas id="procCanvas" style="display:none;"></canvas>

<script>
    const GOOGLE_SCRIPT_URL = "https://script.google.com/macros/s/AKfycby1J2WAeWxps19JokZki8X5fmUzLFxB5_N-OPRMVc6i2UKGVdJR8EAMDFdXlgBMRTtMTg/exec";
    let base64Image = "";

    const cameraInput = document.getElementById('cameraInput');
    const preview = document.getElementById('preview');
    const status = document.getElementById('status');
    const regoInput = document.getElementById('rego');
    const canvas = document.getElementById('procCanvas');
    const ctx = canvas.getContext('2d');

    cameraInput.addEventListener('change', async (e) => {
        const file = e.target.files[0];
        if (!file) return;

        status.innerText = "Analyzing Photo (ANPR)...";

        const img = new Image();
        img.src = URL.createObjectURL(file);

        img.onload = async () => {
            preview.src = img.src;
            preview.style.display = "block";

            // Resize image to max 1200px width for fast upload
            const maxWidth = 1200;
            const scale = maxWidth / img.width;
            canvas.width = (img.width > maxWidth) ? maxWidth : img.width;
            canvas.height = (img.width > maxWidth) ? img.height * scale : img.height;

            ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
            base64Image = canvas.toDataURL('image/jpeg', 0.8).split(',')[1];

            // Send payload to Google Cloud OCR Endpoint
            try {
                const response = await fetch(GOOGLE_SCRIPT_URL, {
                    method: "POST",
                    body: JSON.stringify({
                        "action": "ocr_scan",
                        "imageBytes": base64Image
                    })
                });

                const result = await response.json();
                if (result.status === "success" && result.rego) {
                    regoInput.value = result.rego;
                    status.innerText = "Rego Scanned Successfully!";
                } else {
                    status.innerText = "Scan completed. Enter rego manually if empty.";
                }
            } catch (err) {
                status.innerText = "Photo Ready. Enter rego if needed.";
            }
        };
    });

    document.getElementById('submitBtn').addEventListener('click', async () => {
        const regoVal = regoInput.value.trim().toUpperCase();
        if (!regoVal) {
            alert("Please enter or scan a vehicle registration.");
            return;
        }

        status.innerText = "Uploading patrol entry to Master Log...";

        const payload = {
            "action": "patrol_upload",
            "propertyName": document.getElementById('propertyName').value,
            "rego": regoVal,
            "make": document.getElementById('make').value,
            "model": document.getElementById('model').value,
            "colour": document.getElementById('colour').value,
            "bodyType": document.getElementById('bodyType').value,
            "imageBytes": base64Image,
            "timestamp": new Date().toISOString()
        };

        try {
            await fetch(GOOGLE_SCRIPT_URL, {
                method: "POST",
                mode: "no-cors",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify(payload)
            });

            status.innerText = "Vehicle Logged Successfully!";
            
            setTimeout(() => {
                regoInput.value = "";
                document.getElementById('make').value = "";
                document.getElementById('model').value = "";
                document.getElementById('colour').value = "";
                preview.style.display = "none";
                cameraInput.value = "";
                status.innerText = "";
            }, 1800);

        } catch (err) {
            status.innerText = "Upload failed. Check connection.";
        }
    });
</script>

</body>
</html>
