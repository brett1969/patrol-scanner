<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>TOW RUN</title>
    
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="RUN">
    
    <link rel="apple-touch-icon" href="icon-run.png?v=1">
    <link rel="icon" type="image/png" href="icon-run.png?v=1">
    <link rel="manifest" href="manifest-run.json?v=1">

    <style>
        * { box-sizing: border-box; }
        body { 
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; 
            margin: 0; 
            padding: 12px; 
            background: #121212; 
            color: #fff; 
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
        }
        .header { text-align: center; margin-top: 4px; margin-bottom: 12px; }
        .header h1 { margin: 0; font-size: 32px; font-weight: 900; color: #ffab00; letter-spacing: 2px; }
        
        .filter-box {
            width: 100%;
            max-width: 440px;
            margin-bottom: 12px;
        }
        select {
            width: 100%;
            height: 50px;
            padding: 0 14px;
            border-radius: 12px;
            border: 1px solid #333;
            background: #1e1e1e;
            color: #ffab00;
            font-size: 18px;
            font-weight: 800;
            outline: none;
            text-align: center;
            text-align-last: center;
            appearance: none;
            -webkit-appearance: none;
        }

        .list-container {
            width: 100%;
            max-width: 440px;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .vehicle-card {
            border-radius: 16px;
            padding: 16px;
            background: #1e1e1e;
            border: 2px solid #333;
            box-shadow: 0 4px 14px rgba(0,0,0,0.5);
            display: flex;
            flex-direction: column;
            gap: 8px;
            position: relative;
        }

        /* DYNAMIC STATUS BORDERS & ACCENTS */
        .status-yellow { border-color: #ffab00 !important; }
        .status-yellow .badge { background: #ffab00; color: #000; }

        .status-red { border-color: #ff1744 !important; }
        .status-red .badge { background: #ff1744; color: #fff; }

        .status-green { border-color: #00e676 !important; }
        .status-green .badge { background: #00e676; color: #000; }

        .card-top {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .rego-title {
            font-size: 26px;
            font-weight: 900;
            letter-spacing: 1px;
            color: #fff;
        }
        .badge {
            font-size: 11px;
            font-weight: 900;
            padding: 4px 10px;
            border-radius: 20px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .card-details {
            font-size: 13px;
            color: #ccc;
            display: flex;
            flex-direction: column;
            gap: 4px;
        }
        .property-name {
            font-size: 15px;
            font-weight: 800;
            color: #fff;
        }

        .action-btn {
            background: #ff1744;
            color: #fff;
            font-weight: 900;
            border: none;
            border-radius: 10px;
            height: 44px;
            font-size: 16px;
            width: 100%;
            margin-top: 6px;
            cursor: pointer;
            letter-spacing: 1px;
            text-decoration: none;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 4px 12px rgba(255, 23, 68, 0.4);
        }
        .action-btn:active { transform: scale(0.97); }

        #status { text-align: center; font-weight: 800; font-size: 15px; margin-top: 14px; color: #ffab00; }
    </style>
</head>
<body>

<div class="header">
    <h1>TOW RUN</h1>
</div>

<div class="filter-box">
    <select id="propertyFilter">
        <option value="ALL" selected>ALL PROPERTIES</option>
    </select>
</div>

<div class="list-container" id="runList">
    <div id="status">LOADING RUN DATA...</div>
</div>

<script>
    const GOOGLE_SCRIPT_URL = "https://script.google.com/macros/s/AKfycbzoWD84FAwprSdWAZlm4YeyjU9ps3kTW_XXN_QMkTJxvm-LMrnFIZ2RzDLDShbV5ATK8g/exec";

    const propertyFilter = document.getElementById('propertyFilter');
    const runList = document.getElementById('runList');
    const statusDiv = document.getElementById('status');

    let allRunData = [];

    window.addEventListener('load', loadRunData);

    async function loadRunData() {
        try {
            const res = await fetch(`${GOOGLE_SCRIPT_URL}?action=get_tow_run`);
            allRunData = await res.json();

            populateProperties(allRunData);
            renderList();
        } catch (e) {
            statusDiv.innerText = "ERROR LOADING RUN DATA";
        }
    }

    function populateProperties(data) {
        const props = new Set();
        data.forEach(item => { if (item.property) props.add(item.property); });

        propertyFilter.innerHTML = '<option value="ALL" selected>ALL PROPERTIES</option>';
        props.forEach(p => {
            const opt = document.createElement('option');
            opt.value = p;
            opt.innerText = p.toUpperCase();
            propertyFilter.appendChild(opt);
        });
    }

    propertyFilter.addEventListener('change', renderList);

    function renderList() {
        runList.innerHTML = '';
        const selectedProp = propertyFilter.value;
        const now = new Date();

        const filtered = allRunData.filter(item => {
            if (selectedProp !== 'ALL' && item.property !== selectedProp) return false;
            return true;
        });

        if (filtered.length === 0) {
            runList.innerHTML = '<div id="status">NO MARKED VEHICLES FOUND</div>';
            return;
        }

        filtered.forEach(item => {
            const card = document.createElement('div');
            
            const markedDate = new Date(item.marked);
            const expiryDate = new Date(item.expiry);
            
            const isExempt = item.pass && item.pass.includes('EXEMPT');
            const isExpired = now >= expiryDate;

            let statusClass = 'status-yellow';
            let badgeText = 'PENDING (6HR)';

            if (isExempt) {
                statusClass = 'status-green';
                badgeText = 'EXEMPT PASS';
            } else if (isExpired) {
                statusClass = 'status-red';
                badgeText = 'READY TO TOW';
            }

            card.className = `vehicle-card ${statusClass}`;

            const formattedMarked = markedDate.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
            const formattedExpiry = expiryDate.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });

            card.innerHTML = `
                <div class="card-top">
                    <div class="rego-title">${item.rego}</div>
                    <div class="badge">${badgeText}</div>
                </div>
                <div class="card-details">
                    <div class="property-name">📍 ${item.property}</div>
                    <div>🕒 Marked: <strong>${formattedMarked}</strong> | Expires: <strong>${formattedExpiry}</strong></div>
                    ${isExempt ? `<div style="color:#00e676; font-weight:bold;">🛡️ ${item.pass}</div>` : ''}
                </div>
                ${!isExempt ? `<a href="tow.html?rego=${encodeURIComponent(item.rego)}&prop=${encodeURIComponent(item.property)}" class="action-btn">🚛 TOW VEHICLE</a>` : ''}
            `;

            runList.appendChild(card);
        });
    }
</script>

</body>
</html>
